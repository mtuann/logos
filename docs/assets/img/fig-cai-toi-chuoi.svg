<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 372" class="oz-fig__svg" role="img" aria-label="Chuỗi cậu bé, sĩ quan trẻ, tướng già: mũi tên nhớ nối tiếp nhau, mũi tên đứt quên nối tướng già về cậu bé"><text x="320" y="30" text-anchor="middle" style="fill:currentColor" font-size="15" font-weight="bold">Nghịch lý viên sĩ quan dũng cảm (Reid)</text><rect x="25" y="96" width="175" height="76" rx="10" style="fill:var(--oz-paper);stroke:var(--oz-ink)" stroke-width="2"/><text x="112.5" y="130" text-anchor="middle" style="fill:currentColor" font-size="14" font-weight="bold">Cậu bé</text><text x="112.5" y="151" text-anchor="middle" style="fill:currentColor" font-size="12.5">bị đòn roi</text><rect x="232" y="96" width="175" height="76" rx="10" style="fill:var(--oz-paper);stroke:var(--oz-ink)" stroke-width="2"/><text x="319.5" y="130" text-anchor="middle" style="fill:currentColor" font-size="14" font-weight="bold">Sĩ quan trẻ</text><text x="319.5" y="151" text-anchor="middle" style="fill:currentColor" font-size="12.5">nhớ chuyện bị đòn</text><rect x="440" y="96" width="175" height="76" rx="10" style="fill:var(--oz-paper);stroke:var(--oz-ink)" stroke-width="2"/><text x="527.5" y="130" text-anchor="middle" style="fill:currentColor" font-size="14" font-weight="bold">Tướng già</text><text x="527.5" y="151" text-anchor="middle" style="fill:currentColor" font-size="12.5">nhớ thời sĩ quan</text><line x1="200" y1="134" x2="222" y2="134" style="stroke:var(--oz-ink)" stroke-width="2"/><polygon points="232,134 222,137.5 222,130.5" style="fill:var(--oz-ink)"/><line x1="407" y1="134" x2="430" y2="134" style="stroke:var(--oz-ink)" stroke-width="2"/><polygon points="440,134 430,137.5 430,130.5" style="fill:var(--oz-ink)"/><text x="216" y="122" text-anchor="middle" style="fill:currentColor" font-size="12">nhớ</text><text x="423" y="122" text-anchor="middle" style="fill:currentColor" font-size="12">nhớ</text><path d="M 527,172 L 527,262 L 112,262 L 112,182" fill="none" style="stroke:var(--oz-ink)" stroke-width="2" stroke-dasharray="7 5"/><polygon points="112,172 115.5,182 108.5,182" style="fill:var(--oz-ink)"/><text x="320" y="288" text-anchor="middle" style="fill:currentColor" font-size="13" font-weight="bold">nhưng tướng già đã QUÊN chuyện bị đòn</text><text x="320" y="330" text-anchor="middle" style="fill:currentColor" font-size="13">Theo Locke: A = B, B = C, mà A ≠ C — quan hệ “là cùng một</text><text x="320" y="350" text-anchor="middle" style="fill:currentColor" font-size="13">người” phải có tính bắc cầu, tiêu chí ký ức trực tiếp vi phạm nó.</text></svg>
