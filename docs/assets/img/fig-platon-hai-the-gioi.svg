<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 380" class="oz-fig__svg" role="img" aria-label="Thế giới Ý niệm với tam giác lý tưởng và thế giới cảm giác với hình vẽ tay méo mó, nối bằng quan hệ tham dự"><rect x="30" y="40" width="260" height="260" rx="12" style="fill:var(--oz-paper);stroke:var(--oz-ink)" stroke-width="2"/><text x="160" y="72" text-anchor="middle" style="fill:currentColor" font-size="15" font-weight="bold">Thế giới Ý niệm</text><text x="160" y="94" text-anchor="middle" style="fill:currentColor" font-size="12.5">(vĩnh cửu, hoàn hảo)</text><polygon points="160,120 100,230 220,230" style="fill:var(--oz-accent);stroke:var(--oz-ink)" stroke-width="2" fill-opacity="0.2"/><text x="160" y="258" text-anchor="middle" style="fill:currentColor" font-size="13">Tam giác lý tưởng</text><text x="160" y="278" text-anchor="middle" style="fill:currentColor" font-size="12.5">ba góc cộng đúng 180°</text><rect x="350" y="40" width="260" height="260" rx="12" style="fill:var(--oz-paper);stroke:var(--oz-ink)" stroke-width="2"/><text x="480" y="72" text-anchor="middle" style="fill:currentColor" font-size="15" font-weight="bold">Thế giới cảm giác</text><text x="480" y="94" text-anchor="middle" style="fill:currentColor" font-size="12.5">(đổi thay, bóng mờ)</text><polygon points="480,125 423,232 537,224" style="fill:var(--oz-accent);stroke:var(--oz-ink)" stroke-width="2" stroke-dasharray="8 6" fill-opacity="0.12"/><text x="480" y="258" text-anchor="middle" style="fill:currentColor" font-size="13">hình vẽ tay</text><text x="480" y="278" text-anchor="middle" style="fill:currentColor" font-size="12.5">méo mó, phai dần</text><line x1="350" y1="170" x2="300" y2="170" style="stroke:var(--oz-ink)" stroke-width="2"/><polygon points="290,170 300,166.5 300,173.5" style="fill:var(--oz-ink)"/><text x="320" y="155" text-anchor="middle" style="fill:currentColor" font-size="13">tham dự</text><text x="320" y="345" text-anchor="middle" style="fill:currentColor" font-size="13">Vật cảm giác “tham dự” vào Ý niệm, nhưng chỉ là bóng mờ của nó.</text></svg>
