<svg viewBox="0 0 640 310" class="oz-fig__svg" role="img" aria-label="Chuỗi A: hiện tại di chuyển giữa quá khứ và tương lai. Chuỗi B: chỉ có quan hệ trước–sau, không có hiện tại đặc biệt"><text x="320" y="28" text-anchor="middle" style="fill:currentColor" font-size="15" font-weight="bold">Chuỗi A: quá khứ – hiện tại – tương lai</text><line x1="60" y1="95" x2="272" y2="95" style="stroke:var(--oz-ink)" stroke-width="2"/><line x1="368" y1="95" x2="580" y2="95" style="stroke:var(--oz-ink)" stroke-width="2"/><text x="150" y="78" text-anchor="middle" style="fill:currentColor" font-size="13">quá khứ</text><text x="490" y="78" text-anchor="middle" style="fill:currentColor" font-size="13">tương lai</text><rect x="272" y="68" width="96" height="54" rx="8" style="fill:var(--oz-accent);stroke:var(--oz-ink)" stroke-width="2" fill-opacity="0.22"/><text x="320" y="101" text-anchor="middle" style="fill:currentColor" font-size="13" font-weight="bold">HIỆN TẠI</text><circle cx="190" cy="95" r="6" style="fill:var(--oz-accent);stroke:var(--oz-ink)" stroke-width="2" fill-opacity="0.14"/><text x="190" y="95" text-anchor="middle" style="fill:currentColor" font-size="16"></text><circle cx="450" cy="95" r="6" style="fill:var(--oz-accent);stroke:var(--oz-ink)" stroke-width="2" fill-opacity="0.14"/><text x="450" y="95" text-anchor="middle" style="fill:currentColor" font-size="16"></text><text x="190" y="124" text-anchor="middle" style="fill:currentColor" font-size="12.5">sinh nhật bạn</text><text x="450" y="124" text-anchor="middle" style="fill:currentColor" font-size="12.5">Tết</text><text x="320" y="152" text-anchor="middle" style="fill:currentColor" font-size="12.5">“hiện tại” trượt dọc trục theo thời gian</text><text x="320" y="188" text-anchor="middle" style="fill:currentColor" font-size="15" font-weight="bold">Chuỗi B: chỉ có trước – sau</text><line x1="60" y1="240" x2="580" y2="240" style="stroke:var(--oz-ink)" stroke-width="2"/><circle cx="200" cy="240" r="6" style="fill:var(--oz-accent);stroke:var(--oz-ink)" stroke-width="2" fill-opacity="0.14"/><text x="200" y="240" text-anchor="middle" style="fill:currentColor" font-size="16"></text><circle cx="440" cy="240" r="6" style="fill:var(--oz-accent);stroke:var(--oz-ink)" stroke-width="2" fill-opacity="0.14"/><text x="440" y="240" text-anchor="middle" style="fill:currentColor" font-size="16"></text><text x="200" y="222" text-anchor="middle" style="fill:currentColor" font-size="12.5">sinh nhật bạn</text><text x="440" y="222" text-anchor="middle" style="fill:currentColor" font-size="12.5">Tết</text><text x="320" y="222" text-anchor="middle" style="fill:currentColor" font-size="13" font-weight="bold">trước</text><text x="320" y="282" text-anchor="middle" style="fill:currentColor" font-size="12.5">quan hệ “trước–sau” không đổi dù hôm nay là ngày nào</text></svg>
