<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 390" class="oz-fig__svg" role="img" aria-label="Hai nhánh: Jones tự quyết định hoặc Black can thiệp — cùng dẫn đến một kết quả"><rect x="220" y="16" width="200" height="64" rx="10" style="fill:var(--oz-paper);stroke:var(--oz-ink)" stroke-width="2"/><text x="320" y="44" text-anchor="middle" style="fill:currentColor" font-size="13" font-weight="bold">Jones quyết định</text><text x="320" y="65" text-anchor="middle" style="fill:currentColor" font-size="12.5">giết Smith</text><rect x="30" y="116" width="250" height="72" rx="10" style="fill:var(--oz-paper);stroke:var(--oz-ink)" stroke-width="2"/><text x="155" y="148" text-anchor="middle" style="fill:currentColor" font-size="13" font-weight="bold">Nhánh 1: Jones tự làm</text><text x="155" y="169" text-anchor="middle" style="fill:currentColor" font-size="12.5">Black chỉ đứng nhìn</text><rect x="360" y="116" width="250" height="72" rx="10" style="fill:var(--oz-paper);stroke:var(--oz-ink)" stroke-width="2"/><text x="485" y="148" text-anchor="middle" style="fill:currentColor" font-size="13" font-weight="bold">Nhánh 2: Jones do dự</text><text x="485" y="169" text-anchor="middle" style="fill:currentColor" font-size="12.5">Black can thiệp, ép tay</text><line x1="320" y1="80" x2="164.8" y2="113.9" style="stroke:var(--oz-ink)" stroke-width="2"/><polygon points="155,116 164,110.4 165.5,117.3" style="fill:var(--oz-ink)"/><line x1="320" y1="80" x2="475.2" y2="113.9" style="stroke:var(--oz-ink)" stroke-width="2"/><polygon points="485,116 474.5,117.3 476,110.4" style="fill:var(--oz-ink)"/><rect x="220" y="232" width="200" height="72" rx="10" style="fill:var(--oz-paper);stroke:var(--oz-ink)" stroke-width="2"/><text x="320" y="264" text-anchor="middle" style="fill:currentColor" font-size="13" font-weight="bold">Kết quả</text><text x="320" y="285" text-anchor="middle" style="fill:currentColor" font-size="12.5">Smith chết — như nhau</text><line x1="155" y1="188" x2="310.3" y2="229.4" style="stroke:var(--oz-ink)" stroke-width="2"/><polygon points="320,232 309.4,232.8 311.2,226" style="fill:var(--oz-ink)"/><line x1="485" y1="188" x2="329.7" y2="229.4" style="stroke:var(--oz-ink)" stroke-width="2"/><polygon points="320,232 328.8,226 330.6,232.8" style="fill:var(--oz-ink)"/><text x="320" y="352" text-anchor="middle" style="fill:currentColor" font-size="13">Jones chịu trách nhiệm ở cả hai nhánh — dù ở nhánh 2, anh ta không thể làm khác.</text></svg>
