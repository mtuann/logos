<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 620 360" class="oz-fig__svg" role="img" aria-label="Ma trận canh bạc của Pascal: tin hay không tin, nhân với Chúa tồn tại hay không tồn tại"><text x="252" y="40" text-anchor="middle" style="fill:currentColor" font-size="14" font-weight="bold">Chúa tồn tại</text><text x="477" y="40" text-anchor="middle" style="fill:currentColor" font-size="14" font-weight="bold">Chúa không tồn tại</text><text x="70" y="126" text-anchor="middle" style="fill:currentColor" font-size="14" font-weight="bold">Tin Chúa</text><text x="70" y="246" text-anchor="middle" style="fill:currentColor" font-size="14" font-weight="bold">Không tin</text><rect x="140" y="60" width="225" height="120" rx="10" style="fill:var(--oz-accent);stroke:var(--oz-ink)" stroke-width="2" fill-opacity="0.16"/><text x="252" y="116" text-anchor="middle" style="fill:currentColor" font-size="14" font-weight="bold">Được cứu rỗi</text><text x="252" y="137" text-anchor="middle" style="fill:currentColor" font-size="12.5">lợi ích vô hạn</text><rect x="365" y="60" width="225" height="120" rx="10" style="fill:var(--oz-paper);stroke:var(--oz-ink)" stroke-width="2"/><text x="477.5" y="116" text-anchor="middle" style="fill:currentColor" font-size="14" font-weight="bold">Không mất gì đáng kể</text><text x="477.5" y="137" text-anchor="middle" style="fill:currentColor" font-size="12.5">chỉ tốn chút công sức</text><rect x="140" y="180" width="225" height="120" rx="10" style="fill:var(--oz-paper);stroke:var(--oz-ink)" stroke-width="2"/><text x="252.5" y="236" text-anchor="middle" style="fill:currentColor" font-size="14" font-weight="bold">Mất mát vô hạn</text><text x="252.5" y="257" text-anchor="middle" style="fill:currentColor" font-size="12.5">hình phạt đời đời</text><rect x="365" y="180" width="225" height="120" rx="10" style="fill:var(--oz-paper);stroke:var(--oz-ink)" stroke-width="2"/><text x="477.5" y="236" text-anchor="middle" style="fill:currentColor" font-size="14" font-weight="bold">Không thêm, không bớt</text><text x="477.5" y="257" text-anchor="middle" style="fill:currentColor" font-size="12.5">cả hai đều như nhau</text><text x="310" y="338" text-anchor="middle" style="fill:currentColor" font-size="13">Pascal: “tin” là canh bạc khôn ngoan — được thì vô hạn, mất thì hữu hạn.</text></svg>
