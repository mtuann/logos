<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 280" class="oz-fig__svg" role="img" aria-label="Ba hộp nối bằng mũi tên: trạng thái tự nhiên, ký khế ước, nhà nước"><text x="320" y="32" text-anchor="middle" style="fill:currentColor" font-size="16" font-weight="bold">Lô-gíc của khế ước xã hội</text><rect x="25" y="92" width="175" height="88" rx="10" style="fill:var(--oz-paper);stroke:var(--oz-ink)" stroke-width="2"/><text x="112.5" y="132" text-anchor="middle" style="fill:currentColor" font-size="14" font-weight="bold">Trạng thái tự nhiên</text><text x="112.5" y="153" text-anchor="middle" style="fill:currentColor" font-size="12.5">ai cũng chống ai</text><rect x="232" y="92" width="175" height="88" rx="10" style="fill:var(--oz-paper);stroke:var(--oz-ink)" stroke-width="2"/><text x="319.5" y="132" text-anchor="middle" style="fill:currentColor" font-size="14" font-weight="bold">Ký khế ước</text><text x="319.5" y="153" text-anchor="middle" style="fill:currentColor" font-size="12.5">đồng thuận chung</text><rect x="440" y="92" width="175" height="88" rx="10" style="fill:var(--oz-paper);stroke:var(--oz-ink)" stroke-width="2"/><text x="527.5" y="132" text-anchor="middle" style="fill:currentColor" font-size="14" font-weight="bold">Nhà nước</text><text x="527.5" y="153" text-anchor="middle" style="fill:currentColor" font-size="12.5">trật tự và luật lệ</text><line x1="200" y1="136" x2="222" y2="136" style="stroke:var(--oz-ink)" stroke-width="2"/><polygon points="232,136 222,139.5 222,132.5" style="fill:var(--oz-ink)"/><line x1="407" y1="136" x2="430" y2="136" style="stroke:var(--oz-ink)" stroke-width="2"/><polygon points="440,136 430,139.5 430,132.5" style="fill:var(--oz-ink)"/><text x="320" y="232" text-anchor="middle" style="fill:currentColor" font-size="13">Hobbes, Locke, Rousseau: ba phiên bản của cùng một câu hỏi —</text><text x="320" y="252" text-anchor="middle" style="fill:currentColor" font-size="13">vì sao ta phải vâng lời, và chính quyền nào xứng đáng?</text></svg>
