<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 276" class="oz-fig__svg" role="img" aria-label="Ba hộp: siêu nhiên (kế hoạch lớn hơn), chủ quan (tự mình đặt ra), khách quan (Wolf: dấn thân vào điều đáng giá)"><text x="320" y="30" text-anchor="middle" style="fill:currentColor" font-size="15" font-weight="bold">Ý nghĩa ở đâu? Ba hướng trả lời</text><rect x="25" y="76" width="185" height="100" rx="10" style="fill:var(--oz-paper);stroke:var(--oz-ink)" stroke-width="2"/><text x="117.5" y="122" text-anchor="middle" style="fill:currentColor" font-size="14" font-weight="bold">Siêu nhiên</text><text x="117.5" y="143" text-anchor="middle" style="fill:currentColor" font-size="12.5">kế hoạch lớn hơn</text><rect x="227" y="76" width="185" height="100" rx="10" style="fill:var(--oz-paper);stroke:var(--oz-ink)" stroke-width="2"/><text x="319.5" y="122" text-anchor="middle" style="fill:currentColor" font-size="14" font-weight="bold">Chủ quan</text><text x="319.5" y="143" text-anchor="middle" style="fill:currentColor" font-size="12.5">tự mình đặt ra</text><rect x="430" y="76" width="185" height="100" rx="10" style="fill:var(--oz-paper);stroke:var(--oz-ink)" stroke-width="2"/><text x="522.5" y="122" text-anchor="middle" style="fill:currentColor" font-size="14" font-weight="bold">Khách quan</text><text x="522.5" y="143" text-anchor="middle" style="fill:currentColor" font-size="12.5">Wolf: điều đáng giá</text><text x="117" y="164" text-anchor="middle" style="fill:currentColor" font-size="12">(tôn giáo)</text><text x="319" y="164" text-anchor="middle" style="fill:currentColor" font-size="12">(không cần trọng tài)</text><text x="522" y="164" text-anchor="middle" style="fill:currentColor" font-size="12">(dấn thân say mê)</text><text x="320" y="224" text-anchor="middle" style="fill:currentColor" font-size="13">Ba hướng không loại trừ nhau hoàn toàn —</text><text x="320" y="246" text-anchor="middle" style="fill:currentColor" font-size="13">một người có thể vừa thấy cái phi lý, vừa dấn thân theo Wolf.</text></svg>
