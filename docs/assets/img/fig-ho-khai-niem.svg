<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 560 478" class="oz-fig__svg" role="img" aria-label="Năm vòng tròn giao nhau từng cặp kề nhau nhưng không có vùng chung cho cả năm"><text x="280" y="30" text-anchor="middle" style="fill:currentColor" font-size="15" font-weight="bold">Tương đồng gia đình (Wittgenstein / Weitz)</text><circle cx="280" cy="310" r="78" style="fill:var(--oz-accent);stroke:var(--oz-ink)" stroke-width="2" fill-opacity="0.14"/><text x="280" y="315" text-anchor="middle" style="fill:currentColor" font-size="13">hội họa</text><circle cx="190" cy="244" r="78" style="fill:var(--oz-accent);stroke:var(--oz-ink)" stroke-width="2" fill-opacity="0.14"/><text x="190" y="249" text-anchor="middle" style="fill:currentColor" font-size="13">âm nhạc</text><circle cx="224" cy="138" r="78" style="fill:var(--oz-accent);stroke:var(--oz-ink)" stroke-width="2" fill-opacity="0.14"/><text x="224" y="143" text-anchor="middle" style="fill:currentColor" font-size="13">văn học</text><circle cx="336" cy="138" r="78" style="fill:var(--oz-accent);stroke:var(--oz-ink)" stroke-width="2" fill-opacity="0.14"/><text x="336" y="143" text-anchor="middle" style="fill:currentColor" font-size="13">điện ảnh</text><circle cx="370" cy="244" r="78" style="fill:var(--oz-accent);stroke:var(--oz-ink)" stroke-width="2" fill-opacity="0.14"/><text x="370" y="249" text-anchor="middle" style="fill:currentColor" font-size="13">game / AI</text><text x="280" y="224" text-anchor="middle" style="fill:currentColor" font-size="30" font-weight="bold">∅</text><text x="280" y="418" text-anchor="middle" style="fill:currentColor" font-size="13">Mỗi cặp kề nhau có điểm chung, nhưng không có</text><text x="280" y="438" text-anchor="middle" style="fill:currentColor" font-size="13">một bản chất chung cho tất cả — đó là cách Weitz</text><text x="280" y="458" text-anchor="middle" style="fill:currentColor" font-size="13">nhìn khái niệm “nghệ thuật”.</text></svg>
