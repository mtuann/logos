<svg viewBox="0 0 560 440" class="oz-fig__svg" role="img" aria-label="Biểu đồ Venn: tri thức là giao của niềm tin, chân lý và biện minh; ví dụ Gettier nằm ở giữa mà vẫn không phải tri thức"><circle cx="205" cy="140" r="110" style="fill:var(--oz-accent);stroke:var(--oz-ink)" stroke-width="2" fill-opacity="0.16"/><circle cx="355" cy="140" r="110" style="fill:var(--oz-accent);stroke:var(--oz-ink)" stroke-width="2" fill-opacity="0.16"/><circle cx="280" cy="265" r="110" style="fill:var(--oz-accent);stroke:var(--oz-ink)" stroke-width="2" fill-opacity="0.16"/><text x="135" y="136" text-anchor="middle" style="fill:currentColor" font-size="14">Tin rằng p</text><text x="430" y="136" text-anchor="middle" style="fill:currentColor" font-size="14">p đúng</text><text x="280" y="358" text-anchor="middle" style="fill:currentColor" font-size="14">Có lý do tốt</text><text x="280" y="184" text-anchor="middle" style="fill:currentColor" font-size="16" font-weight="bold">JTB?</text><line x1="400" y1="392" x2="304.4" y2="199" style="stroke:var(--oz-ink)" stroke-width="2" stroke-dasharray="7 5"/><polygon points="300,190 307.6,197.4 301.3,200.5" style="fill:var(--oz-ink)"/><text x="552" y="408" text-anchor="end" style="fill:currentColor" font-size="13">Ví dụ Gettier: đủ cả ba điều kiện,</text><text x="552" y="426" text-anchor="end" style="fill:currentColor" font-size="13">vẫn không phải tri thức.</text></svg>
