<svg viewBox="0 0 640 400" class="oz-fig__svg" role="img" aria-label="Mary trong phòng đen trắng và Mary bước ra ngoài thấy màu sắc"><line x1="320" y1="50" x2="320" y2="310" style="stroke:var(--oz-ink)" stroke-width="1.5" stroke-dasharray="7 5"/><text x="160" y="30" text-anchor="middle" style="fill:currentColor" font-size="14" font-weight="bold">Trong phòng: chỉ đen – trắng</text><text x="480" y="30" text-anchor="middle" style="fill:currentColor" font-size="14" font-weight="bold">Bước ra ngoài: lần đầu thấy màu</text><rect x="60" y="58" width="200" height="190" rx="10" style="fill:var(--oz-paper);stroke:var(--oz-ink)" stroke-width="2"/><line x1="78" y1="168" x2="242" y2="168" style="stroke:var(--oz-ink)" stroke-width="2"/><rect x="88" y="128" width="26" height="40" style="fill:var(--oz-ink)" fill-opacity="0.55"/><rect x="118" y="138" width="26" height="30" style="fill:var(--oz-ink)" fill-opacity="0.35"/><rect x="148" y="122" width="26" height="46" style="fill:var(--oz-ink)" fill-opacity="0.7"/><rect x="88" y="186" width="120" height="44" rx="6" style="fill:var(--oz-ink);stroke:var(--oz-ink)" stroke-width="2" fill-opacity="0.25"/><text x="148" y="212" text-anchor="middle" style="fill:currentColor" font-size="12">TV đen trắng</text><circle cx="232" cy="112" r="11" style="fill:var(--oz-ink)" fill-opacity="0.6"/><rect x="223" y="125" width="18" height="36" rx="8" style="fill:var(--oz-ink)" fill-opacity="0.6"/><text x="160" y="278" text-anchor="middle" style="fill:currentColor" font-size="13">biết HẾT vật lý về màu sắc</text><text x="160" y="300" text-anchor="middle" style="fill:currentColor" font-size="13">nhưng chưa từng thấy màu</text><circle cx="480" cy="160" r="62" style="fill:var(--oz-accent)" fill-opacity="0.35"/><circle cx="430" cy="205" r="30" style="fill:var(--oz-ok)" fill-opacity="0.35"/><circle cx="535" cy="200" r="24" style="fill:var(--oz-accent)" fill-opacity="0.55"/><circle cx="490" cy="110" r="20" style="fill:var(--oz-ok)" fill-opacity="0.5"/><text x="480" y="278" text-anchor="middle" style="fill:currentColor" font-size="13" font-weight="bold">Cô ấy học được điều gì mới?</text><text x="320" y="362" text-anchor="middle" style="fill:currentColor" font-size="13">Jackson (1982): nếu Mary học được điều mới, vật lý chưa nói hết mọi sự thật.</text></svg>
