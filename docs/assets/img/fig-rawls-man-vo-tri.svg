<svg viewBox="0 0 640 400" class="oz-fig__svg" role="img" aria-label="Người sau màn vô tri chọn giữa xã hội bình quân và xã hội chênh lệch nhưng người nghèo nhất khá hơn"><text x="320" y="26" text-anchor="middle" style="fill:currentColor" font-size="16" font-weight="bold">Thí nghiệm tư duy: màn vô tri</text><rect x="30" y="52" width="190" height="292" rx="12" style="fill:var(--oz-paper);stroke:var(--oz-ink)" stroke-width="2" stroke-dasharray="8 6"/><text x="125" y="80" text-anchor="middle" style="fill:currentColor" font-size="14" font-weight="bold">MÀN VÔ TRI</text><text x="125" y="101" text-anchor="middle" style="fill:currentColor" font-size="12.5">(không biết mình là ai)</text><circle cx="125" cy="165" r="20" style="fill:var(--oz-accent);stroke:var(--oz-ink)" stroke-width="2" fill-opacity="0.35"/><rect x="103" y="190" width="44" height="80" rx="20" style="fill:var(--oz-accent);stroke:var(--oz-ink)" stroke-width="2" fill-opacity="0.35"/><text x="125" y="302" text-anchor="middle" style="fill:currentColor" font-size="12.5">người chọn</text><line x1="220" y1="165" x2="291.8" y2="115.7" style="stroke:var(--oz-ink)" stroke-width="2"/><polygon points="300,110 293.7,118.5 289.8,112.8" style="fill:var(--oz-ink)"/><line x1="220" y1="165" x2="294.3" y2="271.8" style="stroke:var(--oz-ink)" stroke-width="2"/><polygon points="300,280 291.4,273.8 297.2,269.8" style="fill:var(--oz-ink)"/><rect x="310" y="55" width="300" height="110" rx="10" style="fill:var(--oz-paper);stroke:var(--oz-ink)" stroke-width="2"/><text x="460" y="106" text-anchor="middle" style="fill:currentColor" font-size="14" font-weight="bold">A: Bình quân</text><text x="460" y="127" text-anchor="middle" style="fill:currentColor" font-size="12.5">mọi người như nhau</text><rect x="310" y="225" width="300" height="110" rx="10" style="fill:var(--oz-paper);stroke:var(--oz-ink)" stroke-width="2"/><text x="460" y="276" text-anchor="middle" style="fill:currentColor" font-size="14" font-weight="bold">B: Chênh lệch</text><text x="460" y="297" text-anchor="middle" style="fill:currentColor" font-size="12.5">người nghèo nhất khá hơn</text><text x="320" y="380" text-anchor="middle" style="fill:currentColor" font-size="14" font-weight="bold">Bạn sẽ chọn A hay B — khi chưa biết mình là ai?</text></svg>
