<svg viewBox="0 0 560 384" class="oz-fig__svg" role="img" aria-label="Đồ thị hai đường: năng lực AI tăng dốc đứng, khả năng kiểm soát tăng chậm, khoảng cách nới rộng"><text x="280" y="30" text-anchor="middle" style="fill:currentColor" font-size="15" font-weight="bold">Năng lực AI vs khả năng kiểm soát</text><line x1="70" y1="300" x2="512" y2="300" style="stroke:var(--oz-ink)" stroke-width="2"/><line x1="70" y1="300" x2="70" y2="52" style="stroke:var(--oz-ink)" stroke-width="2"/><text x="508" y="322" text-anchor="end" style="fill:currentColor" font-size="12.5">thời gian →</text><text x="70" y="40" text-anchor="middle" style="fill:currentColor" font-size="12.5">mức độ</text><path d="M 80,288 L 140,282 L 200,270 L 260,250 L 320,220 L 380,180 L 440,130 L 500,70" fill="none" style="stroke:var(--oz-accent)" stroke-width="3"/><path d="M 80,288 L 160,278 L 240,268 L 320,260 L 400,254 L 480,250" fill="none" style="stroke:var(--oz-ok)" stroke-width="2.5" stroke-dasharray="7 5"/><rect x="90" y="56" width="190" height="56" rx="8" style="fill:var(--oz-paper);stroke:var(--oz-ink)" stroke-width="1.5"/><line x1="102" y1="74" x2="132" y2="74" style="stroke:var(--oz-accent)" stroke-width="3"/><text x="140" y="78" text-anchor="start" style="fill:currentColor" font-size="12.5">năng lực AI</text><line x1="102" y1="98" x2="132" y2="98" style="stroke:var(--oz-ok)" stroke-width="2.5" stroke-dasharray="7 5"/><text x="140" y="102" text-anchor="start" style="fill:currentColor" font-size="12.5">khả năng kiểm soát</text><text x="280" y="342" text-anchor="middle" style="fill:currentColor" font-size="13">Khoảng cách nới rộng theo thời gian —</text><text x="280" y="362" text-anchor="middle" style="fill:currentColor" font-size="13">lập luận cho nghiên cứu an toàn AI.</text></svg>
