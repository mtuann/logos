<svg viewBox="0 0 720 324" class="oz-fig__svg" role="img" aria-label="Trục thời gian: Trúc Lâm Yên Tử (thế kỷ 13), phong trào Duy Tân (đầu thế kỷ 20), khoa cử cuối cùng (1919), Trần Đức Thảo (1951), hiện sinh ở miền Nam, Trần Đình Hượu (1994)"><text x="360" y="30" text-anchor="middle" style="fill:currentColor" font-size="16" font-weight="bold">Triết học Việt Nam: một trục thời gian</text><line x1="90" y1="170" x2="630" y2="170" style="stroke:var(--oz-ink)" stroke-width="2"/><line x1="90" y1="158" x2="90" y2="182" style="stroke:var(--oz-ink)" stroke-width="2"/><text x="90" y="118" text-anchor="middle" style="fill:currentColor" font-size="13" font-weight="bold">TK 13</text><text x="90" y="140" text-anchor="middle" style="fill:currentColor" font-size="12.5">Trúc Lâm Yên Tử</text><line x1="198" y1="158" x2="198" y2="182" style="stroke:var(--oz-ink)" stroke-width="2"/><text x="198" y="208" text-anchor="middle" style="fill:currentColor" font-size="12.5">Phong trào Duy Tân</text><text x="198" y="230" text-anchor="middle" style="fill:currentColor" font-size="13" font-weight="bold">đầu TK 20</text><line x1="306" y1="158" x2="306" y2="182" style="stroke:var(--oz-ink)" stroke-width="2"/><text x="306" y="118" text-anchor="middle" style="fill:currentColor" font-size="13" font-weight="bold">1919</text><text x="306" y="140" text-anchor="middle" style="fill:currentColor" font-size="12.5">Khoa cử cuối cùng</text><line x1="414" y1="158" x2="414" y2="182" style="stroke:var(--oz-ink)" stroke-width="2"/><text x="414" y="208" text-anchor="middle" style="fill:currentColor" font-size="12.5">Trần Đức Thảo</text><text x="414" y="230" text-anchor="middle" style="fill:currentColor" font-size="13" font-weight="bold">1951</text><line x1="522" y1="158" x2="522" y2="182" style="stroke:var(--oz-ink)" stroke-width="2"/><text x="522" y="118" text-anchor="middle" style="fill:currentColor" font-size="13" font-weight="bold">1950–60</text><text x="522" y="140" text-anchor="middle" style="fill:currentColo