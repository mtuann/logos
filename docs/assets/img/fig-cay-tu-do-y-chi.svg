<svg viewBox="0 0 740 336" class="oz-fig__svg" role="img" aria-label="Cây các lập trường về tự do ý chí: bất tương thích luận (tất định luận cứng, thuyết ý chí tự do), tương thích luận, và hoài nghi về trách nhiệm"><rect x="220" y="16" width="300" height="52" rx="10" style="fill:var(--oz-paper);stroke:var(--oz-ink)" stroke-width="2"/><text x="370" y="46.9" text-anchor="middle" style="fill:currentColor" font-size="14" font-weight="bold">Tất định luận có loại trừ tự do?</text><rect x="12" y="120" width="228" height="64" rx="10" style="fill:var(--oz-paper);stroke:var(--oz-ink)" stroke-width="2"/><text x="126" y="148" text-anchor="middle" style="fill:currentColor" font-size="15" font-weight="bold">Bất tương thích luận</text><text x="126" y="169" text-anchor="middle" style="fill:currentColor" font-size="12.5">không tương thích</text><rect x="246" y="120" width="228" height="64" rx="10" style="fill:var(--oz-paper);stroke:var(--oz-ink)" stroke-width="2"/><text x="360" y="148" text-anchor="middle" style="fill:currentColor" font-size="15" font-weight="bold">Tương thích luận</text><text x="360" y="169" text-anchor="middle" style="fill:currentColor" font-size="12.5">tự do = làm theo ý mình</text><rect x="480" y="120" width="228" height="64" rx="10" style="fill:var(--oz-paper);stroke:var(--oz-ink)" stroke-width="2" stroke-dasharray="8 6"/><text x="594" y="148" text-anchor="middle" style="fill:currentColor" font-size="15" font-weight="bold">Hoài nghi về trách nhiệm</text><text x="594" y="169" text-anchor="middle" style="fill:currentColor" font-size="12.5">trách nhiệm tối hậu là ảo</text><rect x="15" y="250" width="200" height="64" rx="10" style="fill:var(--oz-paper);stroke:var(--oz-ink)" stroke-width="2"/><text x="115" y="278" text-anchor="middle" style="fill:currentColor" font-size="15" font-weight="bold">Tất định luận cứng</text><text x="115" y="299" text-anchor="middle" style="fill:currentColor" font-size="12.5">không có tự do ý chí</text><rect x="235" y="250" width="200" height="64" rx="10" style="fill:var(--oz-paper);stroke:var(--oz-ink)" stroke-width="2"/><text x="335" y="278" text-anchor="middle" style="fill:currentColor" font-size="15" font-weight="bold">Thuyết ý chí tự do</text><text x="335" y="299" text-anchor="middle" style="fill:currentColor" font-size="12.5">tất định luận sai</text><line x1="370" y1="68" x2="135.8" y2="117.9" style="stroke:var(--oz-ink)" stroke-width="2"/><polygon points="126,120 135.1,114.5 136.5,121.3" style="fill:var(--oz-ink)"/><line x1="370" y1="68" x2="361.9" y2="110.2" style="stroke:var(--oz-ink)" stroke-width="2"/><polygon points="360,120 358.5,109.5 365.3,110.8" style="fill:var(--oz-ink)"/><line x1="370" y1="68" x2="584.3" y2="117.7" style="stroke:var(--oz-ink)" stroke-width="2"/><polygon points="594,120 583.5,121.1 585.1,114.3" style="fill:var(--oz-ink)"/><line x1="126" y1="184" x2="116.6" y2="240.1" style="stroke:var(--oz-ink)" stroke-width="2"/><polygon points="115,250 113.2,239.6 120.1,240.7" style="fill:var(--oz-ink)"/><line x1="126" y1="184" x2="325.5" y2="247" style="stroke:var(--oz-ink)" stroke-width="2"/><polygon points="335,250 324.4,250.3 326.5,243.7" style="fill:var(--oz-ink)"/></svg>
