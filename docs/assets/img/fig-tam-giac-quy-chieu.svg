<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 560 400" class="oz-fig__svg" role="img" aria-label="Tam giác Ogden và Richards: ký hiệu, tư tưởng, vật; cạnh đáy đứt nét"><rect x="200" y="16" width="160" height="62" rx="10" style="fill:var(--oz-paper);stroke:var(--oz-ink)" stroke-width="2"/><text x="280" y="43" text-anchor="middle" style="fill:currentColor" font-size="14" font-weight="bold">Tư tưởng</text><text x="280" y="64" text-anchor="middle" style="fill:currentColor" font-size="12.5">khái niệm “cây”</text><rect x="24" y="296" width="160" height="62" rx="10" style="fill:var(--oz-paper);stroke:var(--oz-ink)" stroke-width="2"/><text x="104" y="323" text-anchor="middle" style="fill:currentColor" font-size="14" font-weight="bold">Ký hiệu</text><text x="104" y="344" text-anchor="middle" style="fill:currentColor" font-size="12.5">chữ &quot;cây&quot;</text><rect x="376" y="296" width="160" height="62" rx="10" style="fill:var(--oz-paper);stroke:var(--oz-ink)" stroke-width="2"/><text x="456" y="323" text-anchor="middle" style="fill:currentColor" font-size="14" font-weight="bold">Vật</text><text x="456" y="344" text-anchor="middle" style="fill:currentColor" font-size="12.5">cái cây thật</text><line x1="158" y1="296" x2="242" y2="78" style="stroke:var(--oz-ink)" stroke-width="2"/><line x1="402" y1="296" x2="318" y2="78" style="stroke:var(--oz-ink)" stroke-width="2"/><line x1="184" y1="327" x2="376" y2="327" style="stroke:var(--oz-ink)" stroke-width="2" stroke-dasharray="8 6"/><text x="160" y="190" text-anchor="middle" style="fill:currentColor" font-size="12.5">tượng trưng</text><text x="400" y="190" text-anchor="middle" style="fill:currentColor" font-size="12.5">quy chiếu</text><text x="280" y="356" text-anchor="middle" style="fill:currentColor" font-size="12.5">không có đường trực tiếp</text></svg>
