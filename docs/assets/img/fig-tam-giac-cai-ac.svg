<svg viewBox="0 0 560 356" class="oz-fig__svg" role="img" aria-label="Tam giác: Thượng đế toàn năng, Thượng đế toàn thiện, đau khổ tồn tại — ba khẳng định không thể cùng đúng"><text x="280" y="30" text-anchor="middle" style="fill:currentColor" font-size="15" font-weight="bold">Bộ ba bất tương thích</text><line x1="205" y1="120" x2="142" y2="266" style="stroke:var(--oz-ink)" stroke-width="2"/><line x1="355" y1="120" x2="418" y2="266" style="stroke:var(--oz-ink)" stroke-width="2"/><line x1="252" y1="301" x2="308" y2="301" style="stroke:var(--oz-ink)" stroke-width="2"/><rect x="170" y="52" width="220" height="66" rx="10" style="fill:var(--oz-paper);stroke:var(--oz-ink)" stroke-width="2"/><text x="280" y="89.9" text-anchor="middle" style="fill:currentColor" font-size="14" font-weight="bold">Thượng đế toàn năng</text><rect x="32" y="268" width="220" height="66" rx="10" style="fill:var(--oz-paper);stroke:var(--oz-ink)" stroke-width="2"/><text x="142" y="305.9" text-anchor="middle" style="fill:currentColor" font-size="14" font-weight="bold">Đau khổ tồn tại</text><rect x="308" y="268" width="220" height="66" rx="10" style="fill:var(--oz-paper);stroke:var(--oz-ink)" stroke-width="2"/><text x="418" y="305.9" text-anchor="middle" style="fill:currentColor" font-size="14" font-weight="bold">Thượng đế toàn thiện</text><rect x="160" y="168" width="240" height="64" rx="10" style="fill:var(--oz-paper);stroke:var(--oz-ink)" stroke-width="1.5"/><text x="280" y="195" text-anchor="middle" style="fill:currentColor" font-size="15" font-weight="bold">không thể cùng đúng?</text><text x="280" y="216" text-anchor="middle" style="fill:currentColor" font-size="12.5">ít nhất một mệnh đề phải xem lại</text></svg>
