<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 332" class="oz-fig__svg" role="img" aria-label="Trục thời gian: hai khoảng không tồn tại trước khi sinh và sau khi chết đối xứng hai bên đời sống"><text x="320" y="30" text-anchor="middle" style="fill:currentColor" font-size="15" font-weight="bold">Đối xứng sinh – tử (Epicurus, Lucretius)</text><path d="M 130,125 L 320,62 L 510,125" fill="none" style="stroke:var(--oz-ink)" stroke-width="2" stroke-dasharray="7 5"/><text x="320" y="52" text-anchor="middle" style="fill:currentColor" font-size="13">hai khoảng “không tồn tại” — có đối xứng không?</text><path d="M 70,170 L 570,170" fill="none" style="stroke:var(--oz-ink)" stroke-width="2"/><circle cx="170" cy="170" r="7" style="fill:var(--oz-accent);stroke:var(--oz-ink)" stroke-width="2" fill-opacity="0.14"/><text x="170" y="170" text-anchor="middle" style="fill:currentColor" font-size="16"></text><circle cx="470" cy="170" r="7" style="fill:var(--oz-accent);stroke:var(--oz-ink)" stroke-width="2" fill-opacity="0.14"/><text x="470" y="170" text-anchor="middle" style="fill:currentColor" font-size="16"></text><text x="170" y="198" text-anchor="middle" style="fill:currentColor" font-size="13">sinh</text><text x="470" y="198" text-anchor="middle" style="fill:currentColor" font-size="13">chết</text><text x="120" y="142" text-anchor="middle" style="fill:currentColor" font-size="13">không tồn tại</text><text x="320" y="142" text-anchor="middle" style="fill:currentColor" font-size="15" font-weight="bold">ĐỜI SỐNG</text><text x="520" y="142" text-anchor="middle" style="fill:currentColor" font-size="13">không tồn tại</text><rect x="120" y="222" width="400" height="62" rx="10" style="fill:var(--oz-paper);stroke:var(--oz-ink)" stroke-width="2"/><text x="320" y="258.2" text-anchor="middle" style="fill:currentColor" font-size="15">“Khi ta tồn tại, cái chết không có mặt”</text><text x="320" y="310" text-anchor="middle" style="fill:currentColor" font-size="12.5">— Epicurus, Thư gửi Menoeceus</text></svg>
