name: Kiểm thử và triển khai

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]   # gắn/bỏ nhãn doi-loi thì chạy lại
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write   # changed_units.py đăng danh sách đơn vị đổi thành bình luận PR

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Bốn job chạy song song (đợt 7): kiểm tra nhanh + kiểm thử Python, build, rồi kiểm thử JS và trình duyệt thật trên site
  # đã build. Deploy chỉ khi cả bốn xanh.
  kiem-tra:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # changed_units.py cần commit gốc để so
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - name: Cài đặt (đúng phiên bản trong uv.lock)
        run: |
          pip install uv==0.11.32
          uv sync --frozen
      - name: requirements.txt khớp uv.lock
        run: |
          uv export --frozen --format requirements-txt --no-emit-project -o requirements.txt
          git diff --exit-code requirements.txt
      - name: Kiểm tra nhanh (song song; tools/kiem_tra.py)
        env:
          # Được sửa đơn vị Lõi đã đóng băng khi: PR mang nhãn doi-loi, hoặc một commit được push có "[doi-loi]".
          LZ_ALLOW_CORE_CHANGE: ${{ (contains(github.event.pull_request.labels.*.name, 'doi-loi') || contains(toJSON(github.event.commits.*.message), '[doi-loi]')) && '1' || '' }}
        run: uv run --frozen python tools/kiem_tra.py
      - name: Kiểm thử Python
        run: uv run --frozen python -m unittest discover -s tests
      - name: Đơn vị thay đổi (không chặn)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PR" ]; then
            uv run --frozen python tools/changed_units.py --base "$BASE_SHA" --head HEAD -o units.md
            gh pr comment "$PR" --body-file units.md --edit-last || gh pr comment "$PR" --body-file units.md
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            uv run --frozen python tools/changed_units.py --base "$BEFORE" --head HEAD -o units.md
          fi
          if [ -f units.md ]; then cat units.md >> "$GITHUB_STEP_SUMMARY"; fi

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - name: Cài đặt
        run: |
          pip install uv==0.11.32
          uv sync --frozen
      - name: Build (strict)
        run: uv run --frozen properdocs build --strict -f mkdocs.yml
      - name: Kích thước
        run: du -sh site
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: site
          retention-days: 1
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site

  kiem-thu-js:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: site
          path: site
      - name: Kiểm thử JavaScript và trình duyệt (jsdom), tìm kiếm
        run: npm test

  trinh-duyet-that:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: site
          path: site
      - name: Cache trình duyệt của Playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Cài Chromium cho Playwright
        run: npx playwright install --with-deps chromium
      - name: axe, điện thoại, thẻ di chuột, tìm kiếm trên Chromium thật
        run: npm run test:real

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [kiem-tra, build, kiem-thu-js, trinh-duyet-that]
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
