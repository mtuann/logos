alan-turing-computing-ma.mind:
  work: null
  title: Alan Turing, “Computing Machinery and Intelligence”, *Mind*, 1950
  body: '"I propose to consider the question, ''Can machines think?'' This should begin with definitions of the meaning of the terms ''machine'' and ''think''."


    "Tôi đề nghị xem xét câu hỏi: ''Máy có thể suy nghĩ không?'' Việc này lẽ ra phải bắt đầu bằng định nghĩa nghĩa của các từ ''máy'' và ''suy nghĩ''." *(bản dịch của Logos)*'
  translator: logos
  license: unknown
  used_in:
  - cau-hoi/tam-tri-va-ai.md#doc-van-ban-goc
  evidence: []
  verified: null
anselm.proslogion:
  work: anselm.proslogion
  title: Anselm, *Proslogion*, chương 2, 1077–1078 (bản tiếng Anh của S. N. Deane)
  body: '"And, indeed, we believe that thou art a being than which nothing greater can be conceived."


    Và quả thật, chúng con tin rằng Ngài là một tồn tại mà không thể nghĩ ra cái gì lớn hơn được. *(bản dịch của Logos)*'
  translator: logos
  license: unknown
  used_in:
  - cau-hoi/luan-chung-ton-giao.md#doc-van-ban-goc
  evidence: []
  verified: null
anselm.proslogion-2:
  work: anselm.proslogion
  title: Anselm, *Proslogion*, chương 1 — bản dịch tiếng Anh của Sidney Norton Deane (1903)
  original: For I do not seek to understand that I may believe, but I believe in order to understand. For this also I believe,—that unless I believed, I should not understand.
  translation: 'Vì con không tìm hiểu để rồi mới tin, nhưng con tin để có thể hiểu. Bởi con còn tin điều này nữa: nếu không tin, con sẽ không hiểu.'
  translator: null
