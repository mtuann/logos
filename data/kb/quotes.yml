maimonides.chi-dan-cho-nguoi-hoang-mang:
  work: null
  title: Maimonides, *Chỉ dẫn cho người hoang mang*, phần I, chương 60 — bản dịch tiếng Anh của M. Friedländer (1904)
  original: In the same manner you will come nearer to the knowledge and comprehension of God by the negative attributes. But you must be careful, in what you negative, to negative by proof, not by mere words, for each time you ascertain by proof that a certain thing, believed to exist in the Creator, must be negatived, you have undoubtedly come one step nearer to the knowledge of God.
  translation: 'Cũng vậy, bạn sẽ đến gần hơn sự hiểu biết và lĩnh hội về Thượng đế nhờ những thuộc tính phủ định. Nhưng phải cẩn thận: điều gì bạn phủ định thì phủ định bằng chứng minh, không chỉ bằng lời; vì mỗi lần bạn xác lập được bằng chứng minh rằng một điều người ta tưởng có nơi Đấng Tạo hóa phải bị phủ định, chắc chắn bạn đã tiến thêm một bước tới sự hiểu biết về Thượng đế.'
  translator: null
  license: unknown
  url: https://www.sacred-texts.com/jud/gfp/gfp070.htm
  used_in:
  - people/maimonides
  evidence: []
  verified: null
manh-tu.manh-tu:
  work: manh-tu.manh-tu
  title: Mạnh Tử, *Mạnh Tử* 3B2 (thiên Đằng Văn công hạ), lời đáp Cảnh Xuân về các thuyết khách — nguyên văn chữ Hán và phiên âm Hán Việt
  original: 得志與民由之，不得志獨行其道。富貴不能淫，貧賤不能移，威武不能屈。此之謂大丈夫。 — Đắc chí dữ dân do chi, bất đắc chí độc hành kỳ đạo. Phú quý bất năng dâm, bần tiện bất năng di, uy vũ bất năng khuất. Thử chi vị đại trượng phu.
  translation: Đắc chí thì cùng dân đi theo đạo, không đắc chí thì một mình giữ đạo của mình. Giàu sang không làm cho hư hỏng, nghèo hèn không làm cho đổi lòng, uy vũ không khuất phục được. Như thế mới gọi là bậc đại trượng phu.
