lao-tu.trich:
  work: null
  title: '*Đạo đức kinh*, chương 64 — nguyên văn chữ Hán theo bản lưu hành (ctext.org) và phiên âm Hán Việt'
  original: 合抱之木，生於毫末；九層之臺，起於累土；千里之行，始於足下。 — Hợp bão chi mộc, sinh ư hào mạt; cửu tằng chi đài, khởi ư lũy thổ; thiên lý chi hành, thủy ư túc hạ.
  translation: Cây to một vòng tay ôm mọc lên từ mầm nhỏ như sợi lông; đài cao chín tầng dựng lên từ từng sọt đất; đường xa nghìn dặm bắt đầu từ chỗ đặt chân.
