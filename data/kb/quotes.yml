thomas-aquinas.tong-luan-than-hoc:
  work: null
  title: Thomas Aquinas, *Tổng luận Thần học* I, câu 1, mục 8, trả lời phản bác 2 — bản dịch tiếng Anh của Fathers of the English Dominican Province (1920)
  original: Since therefore grace does not destroy nature but perfects it, natural reason should minister to faith as the natural bent of the will ministers to charity.
  translation: Vậy, vì ân sủng không phá hủy tự nhiên mà hoàn thiện nó, lý trí tự nhiên phải phục vụ đức tin, như khuynh hướng tự nhiên của ý chí phục vụ đức ái.
