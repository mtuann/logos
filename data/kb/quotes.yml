  title: '*Mặc Tử*, thiên 15 “Kiêm ái trung” (兼愛中) — nguyên văn chữ Hán và phiên âm Hán Việt'
  original: 視人之國若視其國，視人之家若視其家，視人之身若視其身。 — Thị nhân chi quốc nhược thị kỳ quốc, thị nhân chi gia nhược thị kỳ gia, thị nhân chi thân nhược thị kỳ thân.
  translation: Coi nước của người như nước của mình, coi nhà của người như nhà của mình, coi thân của người như thân của mình.
