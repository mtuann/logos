j-s-mill.on-liberty:
  work: mill.on-liberty
  title: J. S. Mill, *On Liberty* (1859), chương 1
  body: '"the only purpose for which power can be rightfully exercised over any member of a civilised community, against his will, is to prevent harm to others."


    Mục đích duy nhất cho phép xã hội can thiệp một cách chính đáng vào tự do của bất kỳ ai, trái với ý muốn của người đó, là để ngăn ngừa sự gây hại cho người khác. *(bản dịch của Logos)*'
  translator: logos
