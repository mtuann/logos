bentham.an-introduction-to-the-principles-of-mor:
  work: bentham.an-introduction-to-the-principles-of-morals-and-le
  title: Bentham, *An Introduction to the Principles of Morals and Legislation* (1789), chương I, đoạn 1 — nguyên văn tiếng Anh, bản Clarendon Press 1907 in lại ấn bản 1823
  original: Nature has placed mankind under the governance of two sovereign masters, pain and pleasure. It is for them alone to point out what we ought to do, as well as to determine what we shall do.
