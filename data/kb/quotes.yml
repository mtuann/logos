john-locke.khao-luan-ve-hieu-biet-cua-con-nguoi:
  work: null
  title: John Locke, *Khảo luận về hiểu biết của con người* (1689), quyển II, chương 1, §2 — nguyên văn tiếng Anh
  original: Let us then suppose the mind to be, as we say, white paper, void of all characters, without any ideas:—How comes it to be furnished? […] Whence has it all the MATERIALS of reason and knowledge? To this I answer, in one word, from EXPERIENCE.
  translation: 'Vậy hãy giả sử tâm trí, như ta vẫn nói, là một tờ giấy trắng, không có chữ nào, không có ý niệm nào: làm sao nó được lấp đầy? […] Nó lấy đâu ra mọi VẬT LIỆU của lý trí và tri thức? Tôi xin trả lời bằng một chữ: từ KINH NGHIỆM.'
