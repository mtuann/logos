mill.on-liberty:
  work: mill.on-liberty
  title: Mill, *On Liberty* (1859), chương II, đoạn 1 — nguyên văn, bản Project Gutenberg
  body: '"If all mankind minus one, were of one opinion, and only one person were of the contrary opinion, mankind would be no more justified in silencing that one person, than he, if he had the power, would be justified in silencing mankind. […] But the peculiar evil of silencing the expression of an opinion is, that it is robbing the human race; posterity as well as the existing generation; those who dissent from the opinion, still more than those who hold it. If the opinion is right, they are deprived of the opportunity of exchanging error for truth: if wrong, they lose, what is almost as great a benefit, the clearer perception and livelier impression of truth, produced by its collision with error."


    "Nếu toàn thể loài người trừ một người cùng chung một ý kiến, và chỉ một người có ý kiến ngược lại, thì loài người cũng chẳng có quyền bịt miệng người ấy hơn gì người ấy, nếu có quyền lực, có quyền bịt miệng loài người. […] Nhưng cái hại riêng của việc bịt miệng một ý kiến là nó cướp đi của cả loài người: của hậu thế cũng như thế hệ hiện tại, của những người không đồng ý với ý kiến ấy còn hơn của những người theo nó. Nếu ý kiến ấy đúng, họ mất cơ hội đổi sai lấy đúng; nếu nó sai, họ mất một lợi ích gần lớn ngang thế: nhận thức rõ hơn và cảm nhận sống động hơn về chân lý, nảy ra khi chân lý va chạm với sai lầm." *(bản dịch của Logos)*'
  translator: logos
  license: unknown
  used_in:
  - doc/mill-tu-do.md#doc-tung-doan
  evidence: []
  verified: null
mill.on-liberty-2:
  work: mill.on-liberty
  title: Mill, *On Liberty* (1859), chương II, đoạn 2, 3 và 6 — nguyên văn, bản Project Gutenberg
  body: '"We can never be sure that the opinion we are endeavouring to stifle is a false opinion; and if we were sure, stifling it would be an evil still. […] All silencing of discussion is an assumption of infallibility. […] There is the greatest difference between presuming an opinion to be true, because, with every opportunity for contesting it, it has not been refuted, and assuming its truth for the purpose of not permitting its refutation."


    "Ta không bao giờ chắc được rằng ý kiến ta đang tìm cách dập tắt là một ý kiến sai; và dù có chắc, dập tắt nó vẫn là điều xấu. […] Mọi sự bịt miệng thảo luận đều là tự cho mình không thể sai. […] Có một khác biệt cực lớn giữa việc coi một ý kiến là đúng vì nó chưa bị bác bỏ dù đã có mọi cơ hội để phản bác nó, và việc mặc định nó đúng để không cho phép ai phản bác nó." *(bản dịch của Logos)*'
  translator: logos
  license: unknown
  used_in:
  - doc/mill-tu-do.md#doc-tung-doan
  evidence: []
  verified: null
mill.on-liberty-3:
  work: mill.on-liberty
  title: Mill, *On Liberty* (1859), chương II, đoạn 21 và 23 — nguyên văn, bản Project Gutenberg
  body: '"[…] however true it may be, if it is not fully, frequently, and fearlessly discussed, it will be held as a dead dogma, not a living truth. […] He who knows only his own side of the case, knows little of that."


    "[…] dù nó đúng đến đâu, nếu không được thảo luận đầy đủ, thường xuyên và không sợ hãi, nó sẽ được giữ như một giáo điều chết, không phải một chân lý sống. […] Người chỉ biết lý lẽ phía mình thì cũng biết rất ít về chính phía mình." *(bản dịch của Logos)*'
  translator: logos
  license: unknown
  used_in:
  - doc/mill-tu-do.md#doc-tung-doan
  evidence: []
  verified: null
mill.on-liberty-4:
  work: mill.on-liberty
  title: Mill, *On Liberty* (1859), chương II, đoạn 34 — nguyên văn, bản Project Gutenberg
  body: '"But there is a commoner case than either of these; when the conflicting doctrines, instead of being one true and the other false, share the truth between them; and the nonconforming opinion is needed to supply the remainder of the truth, of which the received doctrine embodies only a part. Popular opinions, on subjects not palpable to sense, are often true, but seldom or never the whole truth."


    "Nhưng có một trường hợp phổ biến hơn cả hai trường hợp trên: khi các học thuyết đối nghịch, thay vì một đúng một sai, lại chia nhau phần sự thật; và cần đến ý kiến không theo số đông để bổ sung phần sự thật còn lại, mà học thuyết được chấp nhận chỉ chứa một phần. Những ý kiến phổ biến về các chủ đề không hiển nhiên đối với giác quan thường đúng, nhưng hiếm khi hoặc không bao giờ là toàn bộ sự thật." *(bản dịch của Logos)*'
  translator: logos
  license: unknown
  used_in:
  - doc/mill-tu-do.md#doc-tung-doan
  evidence: []
  verified: null
mill.on-liberty-5:
  work: mill.on-liberty
  title: Mill, *On Liberty* (1859), chương I — nguyên văn tiếng Anh
  original: That principle is, that the sole end for which mankind are warranted, individually or collectively, in interfering with the liberty of action of any of their number, is self-protection. That the only purpose for which power can be rightfully exercised over any member of a civilised community, against his will, is to prevent harm to others.
  translation: 'Nguyên tắc ấy là: mục đích duy nhất cho phép loài người, từng cá nhân hay tập thể, can thiệp vào tự do hành động của bất kỳ ai trong số họ, là tự vệ. Rằng mục đích duy nhất để quyền lực được thực thi chính đáng đối với bất kỳ thành viên nào của một cộng đồng văn minh, trái với ý muốn của người đó, là ngăn người đó gây hại cho người khác.'
  translator: null
  license: unknown
