  work: null
  title: Platon, *Biện hộ của Socrates* 38a — bản dịch tiếng Anh của Benjamin Jowett
  original: …daily to discourse about virtue, and of those other things about which you hear me examining myself and others, is the greatest good of man, and that the unexamined life is not worth living…
  translation: …mỗi ngày bàn luận về đức hạnh và về những điều khác mà các vị nghe tôi xem xét chính mình và người khác, là điều tốt đẹp nhất cho con người, và cuộc đời không được xem xét thì không đáng sống…
