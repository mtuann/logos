boethius.an-ui-cua-triet-hoc:
  work: null
  title: Boethius, *An ủi của Triết học*, Quyển V (khoảng 524; bản dịch tiếng Anh của H. R. James, 1897)
  body: 'Boethius đặt vấn đề: nếu Thượng đế thấy trước mọi sự và không thể lầm, thì mọi sự ắt phải xảy ra đúng như Người thấy — vậy con người còn tự do gì? Bà Triết học (nhân vật đối thoại với ông) đáp: sai lầm nằm ở chữ "thấy trước". Thượng đế không sống trong thời gian như ta; Người sống trong một hiện tại vĩnh cửu, nơi quá khứ, hiện tại và tương lai đều "đang diễn ra". Vì vậy Người không *tiên đoán* hành động của bạn — Người *chứng kiến* nó, như bạn chứng kiến một người đang ngồi trước mặt. Mà chứng kiến không phải là ép buộc.


    Định nghĩa nổi tiếng của Boethius về vĩnh cửu, nguyên văn Latin: *"Aeternitas igitur est interminabilis vitae tota simul et perfecta possessio"* — "Vĩnh cửu là sự chiếm hữu trọn vẹn, đồng thời và hoàn hảo một đời sống vô hạn." *(lược dịch của Logos)*


    Toàn văn bản dịch: Project Gutenberg (phạm vi công cộng tại Hoa Kỳ). <http://www.gutenberg.org/ebooks/14328>'
  translator: null
  license: unknown
  used_in:
  - cau-hoi/dinh-menh.md#doc-van-ban-goc
  evidence: []
  verified: null
chu-hy.chu-tu-ngu-loai:
  work: chu-hy.chu-tu-ngu-loai
  title: Chu Hy, *Chu Tử ngữ loại* (朱子語類), quyển 94, lời đáp học trò về Thái cực — nguyên văn chữ Hán và phiên âm Hán Việt
  original: 本只是一太極，而萬物各有稟受，又自各全具一太極爾。如月在天，只一而已；及散在江湖，則隨處而見，不可謂月已分也。 — Bản chỉ thị nhất Thái cực, nhi vạn vật các hữu bẩm thụ, hựu tự các toàn cụ nhất Thái cực nhĩ. Như nguyệt tại thiên, chỉ nhất nhi dĩ; cập tán tại giang hồ, tắc tùy xứ nhi kiến, bất khả vị nguyệt dĩ phân dã.
  translation: Vốn chỉ có một Thái cực, nhưng muôn vật mỗi vật đều bẩm thụ, lại mỗi vật tự có đủ trọn một Thái cực. Như mặt trăng trên trời chỉ có một mà thôi; khi rải xuống sông hồ thì chỗ nào cũng thấy, không thể nói rằng mặt trăng đã bị chia ra.
