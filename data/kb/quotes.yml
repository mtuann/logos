hume.an-enquiry-concerning-human-understandin:
  work: hume.an-enquiry-concerning-human-understanding
  title: Hume, *An Enquiry Concerning Human Understanding*, 1748, mục VIII, đoạn 73
  body: '"But to proceed in this reconciling project with regard to the question of liberty and necessity; the most contentious question of metaphysics, the most contentious science; it will not require many words to prove, that all mankind have ever agreed in the doctrine of liberty as well as in that of necessity, and that the whole dispute, in this respect also, has been hitherto merely verbal. For what is meant by liberty, when applied to voluntary actions? We cannot surely mean that actions have so little connexion with motives, inclinations, and circumstances, that one does not follow with a certain degree of uniformity from the other, and that one affords no inference by which we can conclude the existence of the other. For these are plain and acknowledged matters of fact. By liberty, then, we can only mean *a power of acting or not acting, according to the determinations of the will;* that is, if we choose to remain at rest, we may; if we choose to move, we also may. Now this hypothetical liberty is universally allowed to belong to every one who is not a prisoner and in chains. Here, then, is no subject of dispute."


    Nhưng để tiếp tục công cuộc hòa giải này đối với câu hỏi về tự do và tất yếu, câu hỏi gây tranh cãi nhất của siêu hình học, ngành khoa học gây tranh cãi nhất, sẽ không cần nhiều lời để chứng minh rằng toàn thể nhân loại xưa nay vẫn luôn đồng ý với học thuyết về tự do cũng như học thuyết về tất yếu, và rằng toàn bộ cuộc tranh cãi, ở phương diện này cũng vậy, cho đến nay chỉ là tranh cãi về chữ nghĩa. Bởi vì khi áp dụng vào những hành động có chủ ý, "tự do" có nghĩa là gì? Chắc chắn ta không thể muốn nói rằng hành động ít liên hệ với động cơ, khuynh hướng và hoàn cảnh đến mức cái này không theo sau cái kia với một mức độ đều đặn nhất định, và cái này không cho phép suy ra sự tồn tại của cái kia. Bởi vì đó là những sự thật hiển nhiên và được thừa nhận. Vậy, "tự do" chỉ có thể có nghĩa là *năng lực hành động hoặc không hành động, theo những quyết định của ý chí*; tức là, nếu ta chọn đứng yên, ta có thể đứng yên; nếu ta chọn cử động, ta cũng có thể cử động. Thứ tự do có điều kiện này được mọi người thừa nhận là thuộc về bất kỳ ai không phải là tù nhân bị xiềng xích. Vậy ở đây không có gì để tranh cãi. *(bản dịch của Logos)*'
  translator: logos
  license: unknown
  used_in:
  - cau-hoi/tu-do-y-chi.md#doc-van-ban-goc
  evidence: []
  verified: null
hume.an-enquiry-concerning-human-understandin-2:
  work: hume.an-enquiry-concerning-human-understanding
  title: Hume, *An Enquiry concerning Human Understanding* (1748), EHU 4.2 và 4.4 — bản Selby-Bigge (1902)
  body: '"*That the sun will not rise to-morrow* is no less intelligible a proposition, and implies no more contradiction than the affirmation, *that it will rise*. […] All reasonings concerning matter of fact seem to be founded on the relation of *Cause and Effect*. By means of that relation alone we can go beyond the evidence of our memory and senses."


    "*Ngày mai mặt trời sẽ không mọc* là một mệnh đề dễ hiểu không kém, và cũng không mâu thuẫn hơn, so với khẳng định *mặt trời sẽ mọc*. […] Mọi suy luận về sự việc thực tế dường như đều dựa trên quan hệ *nguyên nhân và kết quả*. Chỉ nhờ quan hệ ấy, ta mới đi được ra ngoài bằng chứng của trí nhớ và giác quan." *(bản dịch của Logos)*'
  translator: logos
  license: unknown
  used_in:
  - doc/hume-nhan-qua.md#doc-tung-doan
  evidence: []
  verified: null
hume.an-enquiry-concerning-human-understandin-3:
  work: hume.an-enquiry-concerning-human-understanding
  title: Hume, *An Enquiry concerning Human Understanding* (1748), EHU 4.21 — bản Selby-Bigge (1902)
  body: '"For all inferences from experience suppose, as their foundation, that the future will resemble the past […]. It is impossible, therefore, that any arguments from experience can prove this resemblance of the past to the future; since all these arguments are founded on the supposition of that resemblance."


    "Bởi mọi suy luận từ kinh nghiệm đều lấy làm nền móng giả định rằng tương lai sẽ giống quá khứ […]. Vậy không lập luận nào từ kinh nghiệm chứng minh được rằng tương lai giống quá khứ, vì mọi lập luận như thế đều dựa trên chính giả định ấy." *(bản dịch của Logos)*'
  translator: logos
  license: unknown
  used_in:
  - doc/hume-nhan-qua.md#doc-tung-doan
  evidence: []
  verified: null
hume.an-enquiry-concerning-human-understandin-4:
  work: hume.an-enquiry-concerning-human-understanding
  title: Hume, *An Enquiry concerning Human Understanding* (1748), EHU 5.6 — bản Selby-Bigge (1902)
  body: '"Custom, then, is the great guide of human life. It is that principle alone which renders our experience useful to us, and makes us expect, for the future, a similar train of events with those which have appeared in the past."


    "Vậy thì thói quen là người dẫn đường vĩ đại của đời người. Chỉ nhờ nguyên lý ấy mà kinh nghiệm mới có ích cho ta, và khiến ta trông đợi ở tương lai một chuỗi sự kiện giống như những gì đã xuất hiện trong quá khứ." *(bản dịch của Logos)*'
  translator: logos
  license: unknown
  used_in:
  - doc/hume-nhan-qua.md#doc-tung-doan
  evidence: []
  verified: null
hume.an-enquiry-concerning-human-understandin-5:
  work: hume.an-enquiry-concerning-human-understanding
  title: Hume, *An Enquiry concerning Human Understanding* (1748), EHU 7.6 và 7.28 — bản Selby-Bigge (1902)
  body: '"We only find, that the one does actually, in fact, follow the other. The impulse of one billiard-ball is attended with motion in the second. […] This connexion, therefore, which we *feel* in the mind, this customary transition of the imagination from one object to its usual attendant, is the sentiment or impression from which we form the idea of power or necessary connexion."


    "Ta chỉ thấy rằng trên thực tế cái này quả có theo sau cái kia. Cú va của quả bi-a thứ nhất đi kèm chuyển động của quả thứ hai. […] Vậy mối liên hệ mà ta *cảm thấy* trong tâm trí, sự chuyển tiếp theo thói quen của trí tưởng tượng từ một sự vật sang cái thường đi kèm nó, chính là cảm nhận hay ấn tượng mà từ đó ta tạo nên ý niệm về sức mạnh hay mối liên hệ tất yếu." *(bản dịch của Logos)*'
  translator: logos
  license: unknown
  used_in:
  - doc/hume-nhan-qua.md#doc-tung-doan
