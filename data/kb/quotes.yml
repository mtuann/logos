jeremy-bentham.an-introduction-to-the-principles-of-mor:
  work: bentham.an-introduction-to-the-principles-of-morals-and-le
  title: Jeremy Bentham, *An Introduction to the Principles of Morals and Legislation*, chương 17, 1789
  body: '"The question is not, Can they reason? nor, Can they talk? but, Can they suffer?"


    "Vấn đề không phải là, chúng có biết suy luận không? cũng không phải là, chúng có biết nói không? mà là, chúng có biết đau khổ không?" *(bản dịch của Logos)*'
  translator: logos
  license: unknown
  used_in:
