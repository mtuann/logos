  title: '*Đại Việt sử ký toàn thư*, Bản kỷ quyển 7, tiểu sử Chu An chép ở năm 1370 — nguyên văn chữ Hán và phiên âm Hán Việt'
  original: 安諫不聽，乃上疏乞斬佞臣七人，皆權幸者，時人號七斬疏。疏入不報，遂掛冠歸田里。 (An gián bất thính, nãi thượng sớ khất trảm nịnh thần thất nhân, giai quyền hạnh giả, thời nhân hiệu Thất trảm sớ. Sớ nhập bất báo, toại quải quan quy điền lý.)
  translation: Chu An can ngăn, vua không nghe; ông bèn dâng sớ xin chém bảy tên nịnh thần, đều là những kẻ có quyền thế được vua sủng ái — người đương thời gọi là “Thất trảm sớ”. Sớ dâng vào không được trả lời; ông bèn treo mũ từ quan, về làng.
  translator: null
