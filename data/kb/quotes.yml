  evidence: []
  verified: null
rousseau.du-contrat-social:
  work: rousseau.du-contrat-social
  title: Rousseau, *Du contrat social* (1762), quyển I, chương 1 — bản dịch tiếng Anh của G. D. H. Cole (1913)
  original: Man is born free; and everywhere he is in chains. One thinks himself the master of others, and still remains a greater slave than they.
  translation: Con người sinh ra tự do, mà đâu đâu cũng mang xiềng xích. Kẻ tưởng mình là chủ của người khác thì vẫn là nô lệ hơn cả họ.
  translator: null
  license: unknown
  url: https://www.gutenberg.org/ebooks/46333
  used_in:
  - people/rousseau
  evidence: []
  verified: null
russell.the-problems-of-philosophy:
  work: russell.the-problems-of-philosophy
  title: Russell, *The Problems of Philosophy* (1912), chương XV, đoạn 3 — nguyên văn, bản in 1912
  body: '"The ‘practical’ man, as this word is often used, is one who recognises only material needs, who realises that men must have food for the body, but is oblivious of the necessity of providing food for the mind. If all men were well off, if poverty and disease had been reduced to their lowest possible point, there would still remain much to be done to produce a valuable society; and even in the existing world the goods of the mind are at least as important as the goods of the body."


    "Người ''thực tế'', theo nghĩa chữ này thường được dùng, là người chỉ thừa nhận những nhu cầu vật chất, người hiểu rằng con người cần thức ăn cho thân thể, nhưng quên rằng cũng phải có thức ăn cho tâm trí. Giả như ai cũng sung túc, giả như nghèo đói và bệnh tật đã giảm đến mức thấp nhất có thể, thì vẫn còn nhiều việc phải làm để có một xã hội đáng giá; và ngay trong thế giới hiện nay, những điều tốt của tâm trí ít nhất cũng quan trọng ngang những điều tốt của thân thể." *(bản dịch của Logos)*'
  translator: logos
  license: unknown
  used_in:
  - doc/russell-gia-tri.md#doc-tung-doan
  evidence: []
  verified: null
russell.the-problems-of-philosophy-2:
  work: russell.the-problems-of-philosophy
  title: Russell, *The Problems of Philosophy* (1912), chương XV, đoạn 4 — nguyên văn, bản in 1912
  body: '"It is true that this is partly accounted for by the fact that, as soon as definite knowledge concerning any subject becomes possible, this subject ceases to be called philosophy, and becomes a separate science."


    "Quả thật, điều này một phần là vì hễ có thể có tri thức chắc chắn về một đề tài nào, thì đề tài ấy thôi được gọi là triết học và trở thành một khoa học riêng." *(bản dịch của Logos)*'
  translator: logos
  license: unknown
  used_in:
  - doc/russell-gia-tri.md#doc-tung-doan
  evidence: []
  verified: null
russell.the-problems-of-philosophy-3:
  work: russell.the-problems-of-philosophy
  title: Russell, *The Problems of Philosophy* (1912), chương XV, đoạn 7 — nguyên văn, bản in 1912
  body: '"The value of philosophy is, in fact, to be sought largely in its very uncertainty. The man who has no tincture of philosophy goes through life imprisoned in the prejudices derived from common sense, from the habitual beliefs of his age or his nation, and from convictions which have grown up in his mind without the co-operation or consent of his deliberate reason. […] Thus, while diminishing our feeling of certainty as to what things are, it greatly increases our knowledge as to what they may be; it removes the somewhat arrogant dogmatism of those who have never travelled into the region of liberating doubt, and it keeps alive our sense of wonder by showing familiar things in an unfamiliar aspect."


    "Thật ra, giá trị của triết học phần lớn phải tìm ở chính sự không chắc chắn của nó. Người chưa từng nhuốm chút triết học đi suốt đời mình như bị giam trong những định kiến rút ra từ lẽ thường, từ những niềm tin quen thuộc của thời đại hay đất nước mình, và từ những xác tín đã lớn lên trong đầu mà không có sự góp sức hay ưng thuận của lý trí tỉnh táo. […] Như vậy, trong khi làm vơi cảm giác chắc chắn của ta về việc sự vật *là* gì, triết học làm tăng rất nhiều hiểu biết của ta về việc chúng *có thể* là gì; nó gỡ bỏ thói giáo điều có phần ngạo mạn của những người chưa từng bước vào vùng hoài nghi giải phóng, và giữ cho sự ngạc nhiên của ta sống mãi bằng cách cho thấy những điều quen thuộc dưới một dáng vẻ lạ lẫm." *(bản dịch của Logos)*'
  translator: logos
  license: unknown
  used_in:
  - doc/russell-gia-tri.md#doc-tung-doan
  evidence: []
  verified: null
russell.the-problems-of-philosophy-4:
  work: russell.the-problems-of-philosophy
  title: Russell, *The Problems of Philosophy* (1912), chương XV, đoạn 9 và 12 — nguyên văn, bản in 1912
  body: '"[…] In contemplation, on the contrary, we start from the not-Self, and through its greatness the boundaries of Self are enlarged […]. The impartiality which, in contemplation, is the unalloyed desire for truth, is the very same quality of mind which, in action, is justice, and in emotion is that universal love which can be given to all, and not only to those who are judged useful or admirable."


    "[…] Ngược lại, trong chiêm ngưỡng, ta xuất phát từ cái không-phải-Tôi, và nhờ tầm vóc của nó mà ranh giới của cái Tôi được nới rộng […]. Sự vô tư, trong chiêm ngưỡng là lòng khao khát chân lý thuần khiết, cũng chính là phẩm chất tâm trí mà trong hành động là công bằng, và trong cảm xúc là tình yêu phổ quát dành cho mọi người, không chỉ cho những ai được xem là có ích hay đáng ngưỡng mộ." *(bản dịch của Logos)*'
  translator: logos
  license: unknown
  used_in:
  - doc/russell-gia-tri.md#doc-tung-doan
  evidence: []
  verified: null
sartre.l-existentialisme-est-un-humanisme:
  work: sartre.l-existentialisme-est-un-humanisme
  title: Sartre, *L'existentialisme est un humanisme* (bài nói 1945, in 1946), phần “bị bỏ rơi” — nguyên văn tiếng Pháp (trích ngắn)
  body: '« l''homme est condamné à être libre. Condamné, parce qu''il ne s''est pas créé lui-même, et par ailleurs cependant libre, parce qu''une fois jeté dans le monde, il est responsable de tout ce qu''il fait. »


    "con người bị kết án phải tự do. Bị kết án, vì không tự tạo ra chính mình; nhưng vẫn tự do, vì một khi đã bị ném vào thế giới, anh ta chịu trách nhiệm về mọi điều mình làm." *(bản dịch của Logos)*'
