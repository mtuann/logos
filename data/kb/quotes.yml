  evidence: []
  verified: null
tran-nhan-tong.cu-tran-lac-dao-phu:
  work: tran-nhan-tong.cu-tran-lac-dao-phu
  title: Trần Nhân Tông, *Cư trần lạc đạo phú*, hội 5 (chữ Nôm) và bài kệ kết (chữ Hán) — nguyên văn, phiên âm, diễn nghĩa của Logos
  body: '丕買処：孛於宮茹，庄沛寻賒。因虧本年些寻孛，典谷処㐱孛羅些。


    *Vậy mới hay: Bụt ở cong nhà, chẳng phải tìm xa. Nhân khuây bản nên ta tìm Bụt, đến cốc hay chỉn Bụt là ta.*


    居塵樂道且隨緣，飢則飧兮困則眠。家中有寶休尋覓，對境無心莫問禪。


    *Cư trần lạc đạo thả tùy duyên, cơ tắc xan hề khốn tắc miên. Gia trung hữu bảo hưu tầm mịch, đối cảnh vô tâm mạc vấn thiền.*


    Vậy mới biết: Bụt ở ngay trong nhà, chẳng phải tìm đâu xa. Vì ta quên mất cái gốc nên mới đi tìm Bụt; đến khi biết ra thì Bụt chính là ta. — Sống giữa bụi trần mà vui với đạo, hãy cứ tùy duyên; đói thì ăn, mệt thì ngủ. Trong nhà có báu, thôi tìm kiếm; gặp cảnh mà tâm không vướng, chớ hỏi thiền. *(bản dịch của Logos)*'
  translator: logos
  license: unknown
  used_in:
  - doc/tho-van-ly-tran.md#doc-tung-doan
  evidence: []
  verified: null
tran-nhan-tong.cu-tran-lac-dao-phu-2:
  work: tran-nhan-tong.cu-tran-lac-dao-phu
  title: Trần Nhân Tông, *Cư trần lạc đạo phú*, hội thứ năm — chữ Nôm và phiên âm quốc ngữ theo Wikisource tiếng Việt
  original: 孛於宮茹 / 庄沛寻賒 / 因虧本年些寻孛 / 典谷処㐱孛羅些 — Bụt ở cong nhà, chẳng phải tìm xa. Nhân khuây bản nên ta tìm bụt; đến cốc hay chỉn bụt là ta.
  translation: Phật ở ngay trong nhà, chẳng phải tìm đâu xa. Vì quên mất gốc của mình nên ta mới đi tìm Phật; đến khi hiểu ra mới biết Phật chính là ta.
