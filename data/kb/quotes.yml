  original: Die Philosophen haben die Welt nur verschieden interpretirt; es kommt aber darauf an, sie zu verändern.
  translation: Các triết gia mới chỉ giải thích thế giới theo những cách khác nhau; nhưng điều cốt yếu là thay đổi nó.
