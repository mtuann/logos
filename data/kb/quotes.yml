thomas-hobbes.leviathan:
  work: hobbes.leviathan
  title: Thomas Hobbes, *Leviathan*, chương 13, 1651
  body: '"In such condition, there is no place for Industry; because the fruit thereof is uncertain; and consequently no Culture of the Earth; no Navigation, nor use of the commodities that may be imported by Sea; no commodious Building; no Instruments of moving, and removing such things as require much force; no Knowledge of the face of the Earth; no account of Time; no Arts; no Letters; no Society; and which is worst of all, continuall feare, and danger of violent death; And the life of man, solitary, poore, nasty, brutish, and short."


    "Trong tình trạng ấy, không có chỗ cho lao động sản xuất; vì thành quả của nó là bấp bênh: và do đó không có nông nghiệp; không có hàng hải, cũng không dùng được hàng hóa nhập bằng đường biển; không có nhà cửa khang trang; không có máy móc di chuyển những thứ cần sức mạnh lớn; không có tri thức về mặt đất; không có tính toán thời gian; không có nghệ thuật; không có chữ nghĩa; không có xã hội; và tệ nhất, nỗi sợ triền miên và nguy cơ chết bạo lực; và đời người thì cô độc, nghèo nàn, bẩn thỉu, tàn bạo, và ngắn ngủi." *(bản dịch của Logos)*'
  translator: logos
  license: unknown
  used_in:
  - cau-hoi/khe-uoc-xa-hoi.md#doc-van-ban-goc
  evidence: []
  verified: null
thomas-hobbes.leviathan-2:
  work: hobbes.leviathan
  title: Thomas Hobbes, *Leviathan* (1651), chương 13 — nguyên văn tiếng Anh, chính tả theo bản in đầu tiên
  original: 'For as the nature of Foule weather, lyeth not in a showre or two of rain; but in an inclination thereto of many dayes together: So the nature of War, consisteth not in actuall fighting; but in the known disposition thereto, during all the time there is no assurance to the contrary. All other time is PEACE.'
  translation: Cũng như bản chất của thời tiết xấu không nằm ở một hai cơn mưa rào mà ở xu hướng mưa kéo dài nhiều ngày, bản chất của chiến tranh không nằm ở việc đánh nhau thật, mà ở thái độ sẵn sàng đánh nhau mà ai cũng biết, suốt thời gian không có gì bảo đảm điều ngược lại. Mọi thời gian khác là HÒA BÌNH.
  translator: null
  license: unknown
