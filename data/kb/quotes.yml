david-hume.a-treatise-of-human-nature:
  work: hume.a-treatise-of-human-nature
  title: David Hume, *A Treatise of Human Nature*, quyển 3 (1740), phần 1, mục 1 — nguyên văn tiếng Anh, bản Project Gutenberg (chính tả đã hiện đại hóa một phần)
  body: '"In every system of morality, which I have hitherto met with, I have always remarked, that the author proceeds for some time in the ordinary way of reasoning, and establishes the being of a God, or makes observations concerning human affairs; when of a sudden I am surprized to find, that instead of the usual copulations of propositions, is, and is not, I meet with no proposition that is not connected with an ought, or an ought not. This change is imperceptible; but is, however, of the last consequence. For as this ought, or ought not, expresses some new relation or affirmation, it is necessary that it should be observed and explained; and at the same time that a reason should be given, for what seems altogether inconceivable, how this new relation can be a deduction from others, which are entirely different from it."


    "Trong mọi hệ thống đạo đức mà tôi từng gặp cho tới nay, tôi luôn nhận thấy rằng tác giả lập luận theo lối thông thường được một lúc, xác lập sự tồn tại của một Thượng đế, hoặc đưa ra những nhận xét về chuyện con người; thì bỗng nhiên tôi ngạc nhiên thấy rằng, thay vì những mối nối quen thuộc giữa các mệnh đề là *là* và *không là*, tôi không gặp mệnh đề nào không được nối bằng một chữ *phải* hay *không được*. Sự thay đổi này khó nhận thấy, nhưng lại hệ trọng vô cùng. Vì chữ *phải* hay *không được* này diễn đạt một quan hệ hay một khẳng định mới, nên cần phải lưu ý và giải thích nó; đồng thời phải đưa ra lý do cho điều có vẻ hoàn toàn không thể hình dung nổi: làm sao quan hệ mới này lại có thể được suy ra từ những quan hệ khác, vốn hoàn toàn khác với nó." *(bản dịch của Logos)*'
  translator: logos
  license: unknown
  used_in:
  - cau-hoi/sieu-dao-duc.md#doc-van-ban-goc
  evidence: []
  verified: null
david-hume.an-enquiry-concerning-human-understandin:
  work: hume.an-enquiry-concerning-human-understanding
  title: David Hume, *An Enquiry Concerning Human Understanding*, mục X 'Of Miracles', 1748
  body: '"That no testimony is sufficient to establish a miracle, unless the testimony be of such a kind, that its falsehood would be more miraculous, than the fact, which it endeavours to establish."


    Không lời chứng nào đủ để xác lập một phép lạ, trừ khi lời chứng ấy thuộc loại mà sự sai lầm của nó còn kỳ lạ hơn cả sự việc mà nó muốn xác lập.


    Đoạn tiếp theo, Hume minh họa (lược dịch): khi nghe ai kể thấy người chết sống lại, ta tự hỏi điều nào có khả năng hơn — người này đang lừa dối hay bị lừa, hay sự việc thực sự đã xảy ra; ta cân hai "phép lạ" với nhau và luôn loại bỏ phép lạ lớn hơn. *(bản dịch của Logos)*'
  translator: logos
  license: unknown
  used_in:
  - cau-hoi/loi-chung.md#doc-van-ban-goc
  evidence: []
  verified: null
