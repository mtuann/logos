bertrand-russell.the-problems-of-philosophy:
  work: russell.the-problems-of-philosophy
  title: Bertrand Russell, *The Problems of Philosophy* (1912), chương XII — nguyên văn tiếng Anh
  body: '"It will be seen that minds do not *create* truth or falsehood. They create beliefs, but when once the beliefs are created, the mind cannot make them true or false, except in the special case where they concern future things which are within the power of the person believing, such as catching trains. What makes a belief true is a *fact*, and this fact does not (except in exceptional cases) in any way involve the mind of the person who has the belief."


    Ta sẽ thấy rằng tâm trí không *tạo ra* cái đúng hay cái sai. Nó tạo ra niềm tin; nhưng một khi niềm tin đã được tạo ra, tâm trí không thể làm cho chúng đúng hay sai, trừ trường hợp đặc biệt khi chúng nói về những việc tương lai nằm trong tầm tay của chính người tin, như chuyện kịp chuyến tàu. Cái làm cho một niềm tin đúng là một *sự kiện*, và sự kiện ấy (trừ những trường hợp ngoại lệ) không hề dính dáng gì đến tâm trí của người có niềm tin. *(bản dịch của Logos)*'
  translator: logos
  license: unknown
  used_in:
  - cau-hoi/chan-ly.md#doc-van-ban-goc
  evidence: []
  verified: null
