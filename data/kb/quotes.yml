khong-tu.luan-ngu:
  work: khong-tu.luan-ngu
  title: Khổng Tử, *Luận ngữ* 15.24 (thiên Vệ Linh Công) — nguyên văn chữ Hán và phiên âm Hán Việt
  original: '子貢問曰：「有一言而可以終身行之者乎？」子曰：「其恕乎！己所不欲，勿施於人。」 — Tử Cống vấn viết: “Hữu nhất ngôn nhi khả dĩ chung thân hành chi giả hồ?” Tử viết: “Kỳ thứ hồ! Kỷ sở bất dục, vật thi ư nhân.”'
  translation: 'Tử Cống hỏi: “Có một chữ nào có thể theo mà làm suốt đời không?” Thầy đáp: “Có lẽ là chữ thứ chăng! Điều mình không muốn, đừng làm cho người.”'
  translator: null
