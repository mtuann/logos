  original: 以有空義故，一切法得成；若無空義者，一切則不成。 (Dĩ hữu không nghĩa cố, nhất thiết pháp đắc thành; nhược vô không nghĩa giả, nhất thiết tắc bất thành.)
  translation: Vì có nghĩa lý của tính không, nên mọi pháp mới thành được; nếu không có nghĩa lý của tính không, thì chẳng gì thành được cả.
