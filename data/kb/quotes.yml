john-stuart-mill.utilitarianism:
  work: mill.utilitarianism
  title: John Stuart Mill, *Utilitarianism*, chương 2, 1863
  body: '"Actions are right in proportion as they tend to promote happiness, wrong as they tend to produce the reverse of happiness. By happiness is intended pleasure, and the absence of pain; by unhappiness, pain, and the privation of pleasure."


    "Hành động đúng tương xứng với mức độ chúng có xu hướng tạo ra hạnh phúc, sai tương xứng với mức độ chúng tạo ra điều ngược lại với hạnh phúc. Hạnh phúc ở đây được hiểu là niềm vui và sự vắng mặt của đau khổ; bất hạnh là đau khổ và sự thiếu vắng niềm vui." *(bản dịch của Logos)*'
  translator: logos
  license: unknown
  used_in:
  - cau-hoi/dao-duc-hanh-dong.md#doc-van-ban-goc
  evidence: []
  verified: null
john-stuart-mill.utilitarianism-2:
  work: mill.utilitarianism
  title: John Stuart Mill, *Utilitarianism* (1863), chương 2 — theo lần in thứ 7 (1879), Project Gutenberg
  body: '"Yet that even this rule, sacred as it is, admits of possible exceptions, is acknowledged by all moralists; the chief of which is when the withholding of some fact (as of information from a malefactor, or of bad news from a person dangerously ill) would preserve some one (especially a person other than oneself) from great and unmerited evil, and when the withholding can only be effected by denial."


    "Thế nhưng ngay cả quy tắc này, thiêng liêng như nó vốn là, vẫn có thể có ngoại lệ, điều mọi nhà đạo đức học đều thừa nhận; ngoại lệ chính là khi việc giữ kín một sự việc (như giấu thông tin với kẻ gian, hay giấu tin dữ với người đang bệnh nặng nguy hiểm) sẽ che chở ai đó (nhất là một người khác chứ không phải chính mình) khỏi một điều ác lớn mà họ không đáng phải chịu, và khi việc giữ kín chỉ có thể thực hiện bằng cách chối." *(bản dịch của Logos)*'
  translator: logos
  license: unknown
  used_in:
  - cau-hoi/noi-doi.md#doc-van-ban-goc
  evidence: []
  verified: null
kant.beantwortung-der-frage-was-ist-aufklarun:
  work: chua-ro.beantwortung-der-frage-was-ist-aufklarung
  title: 'Kant, *Beantwortung der Frage: Was ist Aufklärung?* (1784), Ak 8:35 — nguyên văn tiếng Đức'
  body: '"Aufklärung ist der Ausgang des Menschen aus seiner selbst verschuldeten Unmündigkeit. Unmündigkeit ist das Unvermögen, sich seines Verstandes ohne Leitung eines anderen zu bedienen. Selbstverschuldet ist diese Unmündigkeit, wenn die Ursache derselben nicht am Mangel des Verstandes, sondern der Entschließung und des Muthes liegt, sich seiner ohne Leitung eines andern zu bedienen. Sapere aude! Habe Muth dich deines *eigenen* Verstandes zu bedienen! ist also der Wahlspruch der Aufklärung."


    "Khai sáng là việc con người bước ra khỏi tình trạng chưa trưởng thành mà chính mình gây ra. Chưa trưởng thành là không có khả năng dùng trí tuệ của mình nếu không có người khác dẫn dắt. Tình trạng ấy là do chính mình gây ra khi nguyên nhân không nằm ở chỗ thiếu trí tuệ, mà ở chỗ thiếu quyết tâm và can đảm để dùng nó mà không cần người khác dẫn dắt. *Sapere aude!* Hãy can đảm dùng trí tuệ của *chính* mình! Đó là khẩu hiệu của khai sáng." *(bản dịch của Logos)*'
  translator: logos
  license: unknown
  used_in:
  - doc/kant-khai-sang.md#doc-tung-doan
  evidence: []
  verified: null
kant.beantwortung-der-frage-was-ist-aufklarun-2:
  work: chua-ro.beantwortung-der-frage-was-ist-aufklarung
  title: 'Kant, *Beantwortung der Frage: Was ist Aufklärung?* (1784), Ak 8:35 — nguyên văn tiếng Đức'
  body: '"Faulheit und Feigheit sind die Ursachen, warum ein so großer Theil der Menschen […] dennoch gerne Zeitlebens unmündig bleiben; und warum es Anderen so leicht wird, sich zu deren Vormündern aufzuwerfen. Es ist so bequem, unmündig zu sein. Habe ich ein Buch, das für mich Verstand hat, einen Seelsorger, der für mich Gewissen hat, einen Arzt der für mich die Diät beurtheilt, u. s. w. so brauche ich mich ja nicht selbst zu bemühen."


    "Lười biếng và hèn nhát là những nguyên nhân khiến một phần rất lớn loài người […] vẫn vui lòng chưa trưởng thành suốt đời, và khiến kẻ khác dễ dàng tự đặt mình làm người giám hộ của họ. Chưa trưởng thành thì thật tiện. Nếu tôi có một cuốn sách hiểu biết thay tôi, một mục sư có lương tâm thay tôi, một bác sĩ phán định chế độ ăn thay tôi, vân vân, thì tôi chẳng cần tự mình nhọc công." *(bản dịch của Logos)*'
  translator: logos
  license: unknown
  used_in:
  - doc/kant-khai-sang.md#doc-tung-doan
  evidence: []
  verified: null
kant.beantwortung-der-frage-was-ist-aufklarun-3:
  work: chua-ro.beantwortung-der-frage-was-ist-aufklarung
  title: 'Kant, *Beantwortung der Frage: Was ist Aufklärung?* (1784), Ak 8:36–37 — nguyên văn tiếng Đức'
  body: '"Zu dieser Aufklärung aber wird nichts erfordert als Freiheit; und zwar die unschädlichste unter allem, was nur Freiheit heißen mag, nämlich die: von seiner Vernunft in allen Stükken öffentlichen Gebrauch zu machen. […] Ich verstehe aber unter dem öffentlichen Gebrauche seiner eigenen Vernunft denjenigen, den jemand als Gelehrter von ihr vor dem ganzen Publikum der Leserwelt macht. Den Privatgebrauch nenne ich denjenigen, den er in einem gewissen ihm anvertrauten bürgerlichen Posten, oder Amte, von seiner Vernunft machen darf."


    "Nhưng khai sáng không đòi hỏi gì ngoài tự do; và là thứ tự do vô hại nhất trong mọi thứ có thể gọi là tự do: tự do dùng lý trí của mình một cách công khai trong mọi việc. […] Tôi hiểu việc dùng lý trí một cách công khai là việc một người, với tư cách học giả, dùng lý trí của mình trước toàn thể công chúng độc giả. Còn việc dùng lý trí riêng tư, tôi gọi là việc người ấy được phép dùng lý trí trong một chức vụ hay cương vị dân sự được giao cho mình." *(bản dịch của Logos)*'
  translator: logos
  license: unknown
  used_in:
  - doc/kant-khai-sang.md#doc-tung-doan
  evidence: []
  verified: null
kant.beantwortung-der-frage-was-ist-aufklarun-4:
  work: chua-ro.beantwortung-der-frage-was-ist-aufklarung
  title: 'Kant, *Beantwortung der Frage: Was ist Aufklärung?* (1784), Ak 8:36 và 8:37 — nguyên văn tiếng Đức'
  body: '"Durch eine Revolution wird vielleicht wohl ein Abfall von persönlichem Despotism und gewinnsüchtiger oder herrschsüchtiger Bedrükkung, aber niemals wahre Reform der Denkungsart zu Stande kommen […]. (Nur ein einziger Herr in der Welt sagt: räsonnirt, so viel ihr wollt, und worüber ihr wollt; aber gehorcht!)"


    "Một cuộc cách mạng có lẽ lật đổ được sự chuyên chế cá nhân và sự áp bức vì tham lợi hay tham quyền, nhưng không bao giờ đem lại một cuộc cải cách thật sự trong lối nghĩ […]. (Chỉ có một ông chủ duy nhất trên đời nói: cứ lý luận bao nhiêu tùy thích, về bất cứ điều gì tùy thích; nhưng hãy vâng lời!)" *(bản dịch của Logos)*'
  translator: logos
  license: unknown
  used_in:
  - doc/kant-khai-sang.md#doc-tung-doan
  evidence: []
  verified: null
kant.grundlegung-zur-metaphysik-der-sitten:
  work: kant.grundlegung-zur-metaphysik-der-sitten
  title: Kant, *Grundlegung zur Metaphysik der Sitten* (1785), mục II, Akademie-Ausgabe 4:429 — nguyên văn tiếng Đức
  original: Handle so, daß du die Menschheit sowohl in deiner Person, als in der Person eines jeden andern jederzeit zugleich als Zweck, niemals bloß als Mittel brauchst.
  translation: Hãy hành động sao cho bạn luôn đối xử với nhân tính, nơi chính bạn cũng như nơi bất kỳ ai khác, đồng thời như một mục đích, không bao giờ chỉ như một phương tiện.
  translator: null
