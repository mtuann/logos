locke.an-essay-concerning-human-understanding:
  work: locke.an-essay-concerning-human-understanding
  title: Locke, *An Essay Concerning Human Understanding*, II.xxvii, 1689/1694
  body: '"For, since consciousness always accompanies thinking, and it is that which makes every one to be what he calls self... in this alone consists personal identity, i.e. the sameness of a rational being: and as far as this consciousness can be extended backwards to any past action or thought, so far reaches the identity of that person."


    "Vì ý thức luôn đi kèm với suy nghĩ, và chính nó làm cho mỗi người là cái mà người ấy gọi là bản ngã... chỉ riêng ở điều này mà bản sắc cá nhân tồn tại, tức là tính đồng nhất của một hữu thể có lý tính: và ý thức này có thể trải ngược về bất kỳ hành động hay ý nghĩ nào trong quá khứ đến đâu, thì bản sắc của người ấy vươn tới đó." *(bản dịch của Logos)*'
  translator: logos
  license: unknown
  used_in:
  - cau-hoi/cai-toi.md#doc-van-ban-goc
  evidence: []
  verified: null
ludwig-wittgenstein.tractatus-logico-philosophicus:
  work: wittgenstein.tractatus-logico-philosophicus
  title: Ludwig Wittgenstein, *Tractatus Logico-Philosophicus* (1921), mệnh đề 6.54 — bản dịch tiếng Anh của C. K. Ogden (1922)
  original: 'My propositions are elucidatory in this way: he who understands me finally recognizes them as senseless, when he has climbed out through them, on them, over them. (He must so to speak throw away the ladder, after he has climbed up on it.)'
  translation: 'Các mệnh đề của tôi làm sáng tỏ theo cách này: ai hiểu tôi thì rốt cuộc sẽ nhận ra chúng vô nghĩa, khi đã trèo ra khỏi chúng — nhờ chúng, trên chúng, vượt qua chúng. (Có thể nói, người ấy phải vứt cái thang đi sau khi đã trèo lên.)'
  translator: null
