leibniz.don-tu-luan:
  work: null
  title: Leibniz, *Đơn tử luận* (viết năm 1714), §32 — bản dịch tiếng Anh của Robert Latta (1898)
  original: And that of sufficient reason, in virtue of which we hold that there can be no fact real or existing, no statement true, unless there be a sufficient reason, why it should be so and not otherwise, although these reasons usually cannot be known by us.
  translation: Và [nguyên lý] lý do đầy đủ, nhờ nó ta cho rằng không thể có sự kiện nào là thật hay hiện hữu, không có mệnh đề nào đúng, nếu không có một lý do đầy đủ vì sao nó như thế mà không khác đi, dù phần lớn những lý do ấy ta không thể biết.
  translator: null
