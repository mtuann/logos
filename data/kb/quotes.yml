descartes.suy-niem-ve-triet-hoc-de-nhat:
  work: null
  title: Descartes, *Suy niệm về Triết học Đệ nhất*, Suy niệm I, 1641 (bản tiếng Anh của John Veitch)
  body: '"Though this be true, I must nevertheless here consider that I am a man, and that, consequently, I am in the habit of sleeping, and representing to myself in dreams those same things, or even sometimes others less probable, which the insane think are presented to them in their waking moments. How often have I dreamt that I was in these familiar circumstances, that I was dressed, and occupied this place by the fire, when I was lying undressed in bed? At the present moment, however, I certainly look upon this paper with eyes wide awake; the head which I now move is not asleep; I extend this hand consciously and with express purpose, and I perceive it; the occurrences in sleep are not so distinct as all this. But I cannot forget that, at other times I have been deceived in sleep by similar illusions; and, attentively considering those cases, I perceive so clearly that there exist no certain marks by which the state of waking can ever be distinguished from sleep, that I feel greatly astonished; and in amazement I almost persuade myself that I am now dreaming."


    Dù điều ấy đúng, tôi vẫn phải xét ở đây rằng tôi là một con người, và do đó tôi có thói quen ngủ, và trong giấc mơ tôi hình dung ra chính những điều ấy, hoặc đôi khi những điều còn khó tin hơn, những điều mà người điên tưởng là mình thấy khi đang thức. Đã bao lần tôi mơ thấy mình ở trong hoàn cảnh quen thuộc này, rằng tôi mặc quần áo chỉnh tề và ngồi bên lò sưởi, trong khi thật ra tôi đang nằm trên giường, không mặc gì? Thế nhưng lúc này đây, chắc chắn tôi đang nhìn tờ giấy này bằng đôi mắt hoàn toàn tỉnh táo; cái đầu tôi đang cử động không hề ngủ; tôi đưa bàn tay này ra một cách có ý thức và có chủ đích, và tôi cảm nhận được nó; những gì xảy ra trong giấc ngủ không rõ ràng đến thế. Nhưng tôi không thể quên rằng có những lúc khác tôi đã bị những ảo ảnh tương tự lừa trong giấc ngủ; và khi xem xét kỹ những trường hợp ấy, tôi thấy rõ đến mức không có dấu hiệu chắc chắn nào giúp phân biệt được trạng thái thức với giấc ngủ, đến nỗi tôi vô cùng sửng sốt; và trong sự sửng sốt ấy, tôi gần như tự thuyết phục mình rằng lúc này tôi đang mơ. *(bản dịch của Logos)*'
  translator: logos
  license: unknown
  used_in:
  - cau-hoi/tri-thuc.md#doc-van-ban-goc
  evidence: []
  verified: null
