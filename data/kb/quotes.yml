trich.tran-nhan-tong-xuan-hieu-sang-xuan:
  work: null
  title: Trần Nhân Tông, “Xuân hiểu” (Sáng xuân) — nguyên văn, phiên âm, bản dịch của Logos
  body: "睡起啟窗扉，  \n不知春已歸。  \n一雙白蝴蝶，  \n拍拍趁花飛。\n\n*Thụy khởi khải song phi,*  \n*Bất tri xuân dĩ quy.*  \n*Nhất song bạch hồ điệp,*  \n*Phách phách sấn hoa phi.*\n\nNgủ dậy, mở cánh cửa sổ, chẳng biết xuân đã về. Một đôi bướm trắng phấp phới đuổi theo hoa mà bay. *(bản dịch của Logos)*"
  translator: logos
  license: unknown
  used_in:
  - doc/tho-van-ly-tran.md#doc-tung-doan
  evidence: []
  verified: null
trich.trang-tu-te-vat-luan:
  work: null
  title: Trang Tử, Tề vật luận — nguyên văn, phiên âm, bản dịch của Logos
  body: '方其夢也，不知其夢也。夢之中又占其夢焉，覺而後知其夢也。且有大覺而後知此其大夢也，而愚者自以為覺，竊竊然知之。……丘也，與女皆夢也；予謂女夢，亦夢也。


    *Phương kỳ mộng dã, bất tri kỳ mộng dã. Mộng chi trung hựu chiêm kỳ mộng yên, giác nhi hậu tri kỳ mộng dã. Thả hữu đại giác nhi hậu tri thử kỳ đại mộng dã, nhi ngu giả tự dĩ vi giác, thiết thiết nhiên tri chi. … Khâu dã, dữ nhữ giai mộng dã; dư vị nhữ mộng, diệc mộng dã.*


    Đang lúc mơ, không biết mình đang mơ. Trong mơ lại còn đoán mộng, tỉnh dậy rồi mới biết là mơ. Lại có cuộc tỉnh lớn rồi mới biết đây là giấc mơ lớn; vậy mà kẻ ngu tự cho mình đã tỉnh, ra vẻ hiểu biết lắm. … Khâu (Khổng Tử) với ngươi đều đang mơ; ta bảo ngươi mơ, cũng là đang mơ. *(bản dịch của Logos)*'
  translator: logos
  license: unknown
  used_in:
  - doc/trang-tu-mong-ho-diep.md#doc-tung-doan
  evidence: []
  verified: null
trich.trang-tu-te-vat-luan-cau-ket:
  work: null
  title: Trang Tử, Tề vật luận, câu kết — nguyên văn, phiên âm, bản dịch của Logos
  body: '周與胡蝶，則必有分矣。此之謂物化。


    *Chu dữ hồ điệp, tắc tất hữu phân hĩ. Thử chi vị vật hóa.*


    Chu với bướm ắt phải có phân biệt. Đó gọi là vật hóa, sự chuyển hóa của muôn vật. *(bản dịch của Logos)*'
  translator: logos
  license: unknown
  used_in:
  - doc/trang-tu-mong-ho-diep.md#doc-tung-doan
  evidence: []
  verified: null
trich.trang-tu-te-vat-luan-doan-ket:
  work: null
  title: Trang Tử, Tề vật luận, đoạn kết — nguyên văn, phiên âm, bản dịch của Logos
  body: '昔者莊周夢為胡蝶，栩栩然胡蝶也，自喻適志與！不知周也。俄然覺，則蘧蘧然周也。不知周之夢為胡蝶與，胡蝶之夢為周與？


    *Tích giả Trang Chu mộng vi hồ điệp, hủ hủ nhiên hồ điệp dã, tự dụ thích chí dư! Bất tri Chu dã. Nga nhiên giác, tắc cừ cừ nhiên Chu dã. Bất tri Chu chi mộng vi hồ điệp dư, hồ điệp chi mộng vi Chu dư?*


    Xưa kia Trang Chu mơ thấy mình là bướm, một con bướm phấp phới bay, tự thấy thỏa thích làm sao! Chẳng biết mình là Chu. Bỗng chốc tỉnh dậy, thì sững sờ vẫn là Chu đây. Không biết là Chu mơ thành bướm, hay bướm mơ thành Chu? *(bản dịch của Logos)*'
  translator: logos
  license: unknown
  used_in:
  - doc/trang-tu-mong-ho-diep.md#doc-tung-doan
  evidence: []
  verified: null
trich.tuyen-ngon-quoc-te-nhan-quyen-1948-dieu-13:
  work: null
  title: Tuyên ngôn Quốc tế Nhân quyền (1948), Điều 13
  body: '"Everyone has the right to freedom of movement and residence within the borders of each State."


    Mọi người đều có quyền tự do đi lại và cư trú trong biên giới của mỗi quốc gia. *(bản dịch của Logos)*'
  translator: logos
  license: unknown
  used_in:
  - cau-hoi/bien-gioi-di-cu.md#doc-van-ban-goc
  evidence: []
  verified: null
trich.van-hanh-thi-de-tu-bao-de-tu:
  work: null
  title: Vạn Hạnh, “Thị đệ tử” (Bảo đệ tử) — nguyên văn, phiên âm, bản dịch của Logos
  body: "身如電影有還無，  \n萬木春榮秋又枯。  \n任運盛衰無怖畏，  \n盛衰如露草頭鋪。\n\n*Thân như điện ảnh hữu hoàn vô,*  \n*Vạn mộc xuân vinh thu hựu khô.*  \n*Nhậm vận thịnh suy vô bố úy,*  \n*Thịnh suy như lộ thảo đầu phô.*\n\nThân như bóng chớp, có rồi lại không; cây cối xuân tươi tốt, thu lại héo khô. Mặc cho vận đời thịnh suy, đừng sợ hãi: thịnh suy như giọt sương trải đầu ngọn cỏ. *(bản dịch của Logos)*"
  translator: logos
  license: unknown
  used_in:
  - doc/tho-van-ly-tran.md#doc-tung-doan
  evidence: []
  verified: null
trich.winston-churchill-phat-bieu-tai-ha-vien-anh-11-11-1947:
  work: null
  title: Winston Churchill, phát biểu tại Hạ viện Anh, 11/11/1947
  body: '"Indeed, it has been said that democracy is the worst form of Government except all those other forms that have been tried from time to time."


    Quả thật người ta đã nói rằng dân chủ là thể chế tồi tệ nhất — ngoại trừ tất cả những thể chế khác đã từng được thử qua. *(bản dịch của Logos)*'
  translator: logos
  license: unknown
  used_in:
  - cau-hoi/ai-nen-cai-tri.md#cac-lap-truong-chinh
  evidence: []
  verified: null
tuan-tu.tuan-tu:
  work: tuan-tu.tuan-tu
  title: Tuân Tử, *Tuân Tử*, thiên 23 *Tính ác* (性惡), thế kỷ 3 TCN — nguyên văn theo ctext.org
  body: '人之性惡，其善者偽也。今人之性，生而有好利焉，順是，故爭奪生而辭讓亡焉；生而有疾惡焉，順是，故殘賊生而忠信亡焉；生而有耳目之欲，有好聲色焉，順是，故淫亂生而禮義文理亡焉。然則從人之性，順人之情，必出於爭奪，合於犯分亂理，而歸於暴。故必將有師法之化，禮義之道，然後出於辭讓，合於文理，而歸於治。用此觀之，人之性惡明矣，其善者偽也。


    *Nhân chi tính ác, kỳ thiện giả ngụy dã. Kim nhân chi tính, sinh nhi hữu hiếu lợi yên, thuận thị, cố tranh đoạt sinh nhi từ nhượng vong yên; sinh nhi hữu tật ố yên, thuận thị, cố tàn tặc sinh nhi trung tín vong yên; sinh nhi hữu nhĩ mục chi dục, hữu hiếu thanh sắc yên, thuận thị, cố dâm loạn sinh nhi lễ nghĩa văn lý vong yên. Nhiên tắc tòng nhân chi tính, thuận nhân chi tình, tất xuất ư tranh đoạt, hợp ư phạm phận loạn lý, nhi quy ư bạo. Cố tất tương hữu sư pháp chi hóa, lễ nghĩa chi đạo, nhiên hậu xuất ư từ nhượng, hợp ư văn lý, nhi quy ư trị. Dụng thử quan chi, nhân chi tính ác minh hĩ, kỳ thiện giả ngụy dã.*


    "Tính người là ác; cái thiện ở người là do con người làm nên. Nay tính người, sinh ra đã ham lợi; thuận theo đó thì tranh giành nảy sinh mà nhường nhịn mất đi. Sinh ra đã có lòng ganh ghét; thuận theo đó thì tàn hại nảy sinh mà trung tín mất đi. Sinh ra đã có ham muốn của tai mắt, thích âm thanh và sắc đẹp; thuận theo đó thì dâm loạn nảy sinh mà lễ nghĩa, văn lý mất đi. Vậy chiều theo tính người, thuận theo tình người, ắt sẽ đi đến tranh giành, phạm vào phận vị, làm rối lẽ phải, rồi quy về bạo loạn. Cho nên phải có sự giáo hóa của thầy và phép tắc, có con đường của lễ nghĩa, rồi sau mới đi đến nhường nhịn, hợp với văn lý, và quy về trật tự. Xét theo đó thì tính người là ác đã rõ, cái thiện ở người là do con người làm nên." *(bản dịch của Logos)*'
  translator: logos
  license: unknown
  used_in:
  - cau-hoi/ban-tinh-con-nguoi.md#doc-van-ban-goc
  evidence: []
  verified: null
tuan-tu.tuan-tu-2:
  work: tuan-tu.tuan-tu
  title: Tuân Tử, *Tuân Tử*, thiên 1 “Khuyến học” (勸學), đoạn mở đầu — nguyên văn chữ Hán và phiên âm Hán Việt
  original: '君子曰：學不可以已。青、取之於藍，而青於藍；冰、水為之，而寒於水。 — Quân tử viết: Học bất khả dĩ dĩ. Thanh, thủ chi ư lam, nhi thanh ư lam; băng, thủy vi chi, nhi hàn ư thủy.'
  translation: 'Người quân tử nói: việc học không thể dừng. Màu xanh lấy từ cây chàm mà xanh hơn chàm; băng do nước làm thành mà lạnh hơn nước.'
  translator: null
  license: unknown
  url: https://ctext.org/xunzi/quan-xue/zh
  used_in:
  - people/tuan-tu
  evidence: []
  verified: null
tue-trung-thuong-si.pham-thanh-bat-di:
  work: tue-trung.pham-thanh-bat-di
  title: Tuệ Trung Thượng Sĩ, *Phàm thánh bất dị*, hai câu — phiên âm Hán Việt theo Nguyễn Huệ Chi (2014)
  original: Ngã nhân tự lộ diệc tự sương, / Phàm thánh như lôi diệc như điện.
