john-locke.two-treatises-of-government:
  work: locke.two-treatises-of-government
  title: John Locke, *Two Treatises of Government* (1689), §27
  body: '"every man has a property in his own person: this no body has any right to but himself. The labour of his body, and the work of his hands, we may say, are properly his."


    Mỗi người đều có quyền sở hữu đối với chính bản thân mình: không ai ngoài anh ta có quyền gì đối với nó. Công sức lao động của thân thể anh ta, và thành quả của đôi tay anh ta, có thể nói là thuộc về anh ta một cách chính đáng. *(bản dịch của Logos)*'
