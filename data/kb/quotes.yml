immanuel-kant.uber-ein-vermeintes-recht-aus-menschenli:
  work: chua-ro.uber-ein-vermeintes-recht-aus-menschenliebe-zu-lug
  title: Immanuel Kant, *Über ein vermeintes Recht aus Menschenliebe zu lügen* (1797) — bản dịch tiếng Anh của T. K. Abbott (lần in thứ 4, 1889)
  body: '"Truth in utterances that cannot be avoided is the formal duty of a man to everyone, however great the disadvantage that may arise from it to him or any other; and although by making a false statement I do no wrong to him who unjustly compels me to speak, yet I do wrong to men in general in the most essential point of duty, so that it may be called a lie (though not in the jurist''s sense), that is, so far as in me lies I cause that declarations in general find no credit, and hence that all rights founded on contract should lose their force; and this is a wrong which is done to mankind."


    "Trung thực trong những lời khai không thể tránh là bổn phận hình thức của một người đối với mọi người, dù điều đó gây thiệt hại lớn đến đâu cho chính người ấy hay cho bất kỳ ai khác; và tuy khi khai sai, tôi không làm điều bất công với kẻ đang bất công ép tôi phải nói, tôi vẫn làm điều bất công với con người nói chung ở điểm cốt yếu nhất của bổn phận, đến mức có thể gọi đó là nói dối (dù không theo nghĩa của luật gia): tức là, trong phạm vi tùy thuộc vào tôi, tôi khiến lời khai nói chung không còn được tin, và do đó mọi quyền dựa trên khế ước đều mất hiệu lực; và đó là một điều bất công gây ra cho nhân loại." *(bản dịch của Logos)*'
  translator: logos
