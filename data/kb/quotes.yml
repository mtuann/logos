kierkegaard-but-danh-joh.fear-and-trembling:
  work: chua-ro.fear-and-trembling
  title: Kierkegaard (bút danh Johannes de Silentio), *Fear and Trembling* (1843), phần “Preliminary Expectoration”, đoạn tả “hiệp sĩ đức tin” — bản dịch tiếng Anh của L. M. Hollander (1923)
  original: He attends to his business, and when one sees him one might think he was a clerk who had lost his soul in doing double bookkeeping, he is so exact.
  translation: Ông lo việc làm ăn của mình, và ai thấy ông cũng có thể tưởng đó là một anh thư ký đã đánh mất linh hồn vào sổ sách kế toán kép, vì ông chỉn chu đến thế.
