hume.an-enquiry-concerning-human-understandin-6:
  work: hume.an-enquiry-concerning-human-understanding
  title: Hume, *An Enquiry concerning Human Understanding* (1748), mục V, phần 1 — nguyên văn tiếng Anh, bản L. A. Selby-Bigge in lại ấn bản 1777
  original: Custom, then, is the great guide of human life. It is that principle alone which renders our experience useful to us, and makes us expect, for the future, a similar train of events with those which have appeared in the past.
  translation: Vậy thì thói quen là người dẫn đường vĩ đại của đời người. Chỉ nhờ nguyên lý ấy mà kinh nghiệm mới có ích cho ta, và khiến ta trông đợi ở tương lai một chuỗi sự kiện giống như những gì đã xuất hiện trong quá khứ.
  translator: null
