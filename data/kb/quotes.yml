rene-descartes.luan-ve-phuong-phap:
  work: chua-ro.luan-ve-phuong-phap
  title: René Descartes, *Luận về phương pháp* (1637), phần IV — bản dịch tiếng Anh của John Veitch
  original: But immediately upon this I observed that, whilst I thus wished to think that all was false, it was absolutely necessary that I, who thus thought, should be somewhat; and as I observed that this truth, I think, therefore I am (COGITO ERGO SUM), was so certain and of such evidence that no ground of doubt, however extravagant, could be alleged by the sceptics capable of shaking it […]
  translation: Nhưng ngay sau đó tôi nhận ra rằng, trong khi tôi muốn nghĩ như thế rằng mọi thứ đều sai, thì chính tôi, kẻ đang nghĩ như thế, nhất thiết phải là một cái gì đó; và thấy rằng chân lý này, tôi tư duy, vậy tôi tồn tại, chắc chắn và hiển nhiên đến mức mọi lý do nghi ngờ của những người hoài nghi, dù ngông cuồng đến đâu, cũng không lay chuyển được […]
  translator: null
  license: unknown
