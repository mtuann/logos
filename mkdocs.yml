site_name: Logos Zero
site_description: Triết học bằng tiếng Việt, bắt đầu từ con số 0 — những câu hỏi lớn, lập luận rõ ràng, đọc chậm.
site_author: Logos Zero
site_url: https://mtuann.github.io/logos/
copyright: Logos Zero · nội dung viết cho người đọc tiếng Việt, không vì mục đích thương mại

theme:
  name: material
  custom_dir: overrides
  language: vi
  font: false
  icon:
    logo: material/owl
  favicon: assets/img/icon.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Chuyển sang chế độ sáng
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Chuyển sang chế độ tối
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Theo hệ thống
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.tooltips
    - toc.follow

plugins:
  - search:
      lang: en
      pipeline: []
      separator: '[\s\-\.,;:!?\(\)\[\]"“”‘’«»…/]+'

hooks:
  - hooks/slugs.py
  - hooks/search_vi.py
  - hooks/kb.py           # shortcode [[count:…]] (KE-HOACH.md mục 4)

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: "#"
      permalink_title: Liên kết tới mục này
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.smartsymbols

extra_css:
  - assets/css/oz.css

extra_javascript:
  - assets/js/core.js
  - assets/js/progress.js
  - assets/js/loader.js

extra:
  generator: false
  # Link "Báo lỗi trang này" cuối mỗi trang (overrides/main.html), mở mẫu .github/ISSUE_TEMPLATE/bao-loi.yml.
  report_issue_url: https://github.com/mtuann/logos/issues/new
  # Quyết định 12 ở KE-HOACH.md: chưa cho công cụ tìm kiếm lập chỉ mục khi logos còn trùng nội dung với logos-zero.
  # Đổi thành false để mở.
  noindex: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

